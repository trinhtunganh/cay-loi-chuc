<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cây Tri Ân · Mừng sinh nhật VinRobotics</title>
<meta name="description" content="Gửi lời cảm ơn, lời chúc giấu tên tới VinRobotics và đồng nghiệp. Mỗi lời chúc là một chiếc lá giúp Cây Tri Ân lớn lên.">
<meta name="theme-color" content="#E4002B">
<meta property="og:type" content="website">
<meta property="og:title" content="Cây Tri Ân · Mừng sinh nhật VinRobotics">
<meta property="og:description" content="Mỗi lời cảm ơn là một chiếc lá. Cùng vun cho Cây Tri Ân thật xanh trước ngày 21/11.">
<meta property="og:image" content="https://trinhtunganh.github.io/cay-loi-chuc/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://trinhtunganh.github.io/cay-loi-chuc/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --brand:#E4002B; --brand-dark:#B80023; --brand-soft:#FDE8EC; --brand-tint:#FFF5F6;
  --ink:#1A1A1A; --ink-2:#3D3D3D; --muted:#6B6B6B; --line:#ECE7E7;
  --card:#FFFFFF; --bg-top:#FFFBF9; --bg-mid:#FDF1F2; --bg-bot:#F4F6EE;
  --leaf:#2F7D57;
  --shadow-sm:0 2px 10px rgba(26,26,26,.06);
  --shadow:0 18px 48px rgba(122,20,40,.14), 0 2px 8px rgba(26,26,26,.06);
  --overlay:rgba(26,16,18,.5);
  --gutter:max(24px, calc((100vw - 1640px)/2 + 24px));
  --feed-w:0px;
  --tree-center:calc((100vw - var(--feed-w))/2);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font-family:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink); background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:3px solid rgba(228,0,43,.35);outline-offset:2px}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:11px 18px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:#d9cfd0;box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(228,0,43,.25)}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px;flex:0 0 auto}

/* Thanh xem trước */
.preview-bar{display:none;background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:7px 16px}
.preview-bar b{color:#ffb3c1;font-weight:500}
body.preview .preview-bar{display:block}

/* Header */
header,.toolbar{position:relative;z-index:6}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:16px var(--gutter) 6px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand .logo-img{height:24px;width:auto}
.brand .sep{width:1px;height:38px;background:var(--line);flex:0 0 auto}
.brand h1{margin:0;font-size:26px;line-height:1.1;font-weight:900;letter-spacing:-.3px}
.hl{color:var(--brand)}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;justify-content:flex-end}

/* Đếm ngược dạng viên */
.cd{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:center;gap:4px 10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 20px;box-shadow:var(--shadow-sm);font-size:14px;color:var(--muted)}
.cd .cd-ico{font-size:18px;align-self:center}
.cd-n{display:inline-flex;align-items:baseline;gap:3px}
.cd-n b{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:right}
.cd-n small{font-size:13px}
.cd.today{color:var(--brand);font-weight:700;font-size:16px}

/* Thanh công cụ */
.toolbar{margin:10px 0 0;padding:0 var(--gutter);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:0 1 440px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 16px;box-shadow:var(--shadow-sm)}
.search svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;padding:6px 0}
.search .count{font-size:13px;color:var(--brand);font-weight:500;white-space:nowrap}
.search .btn{padding:6px 12px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:all .2s}
.chip:hover{background:#fff}
.chip i{width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:inline-block}
.chip.flower i{border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--brand)}
.chip.on{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark);font-weight:500}

/* Sân khấu cây */
.stage{position:relative;width:100%}
#tree{width:100%;height:auto;display:block;max-height:calc(100vh - 170px);min-height:360px;overflow:visible}
body.preview #tree{max-height:calc(100vh - 204px)}
.leaf{cursor:pointer;outline:none}
.leaf .shape{transition:transform .25s,filter .25s,opacity .35s;transform-box:fill-box;transform-origin:0 50%}
.leaf.flower .shape{transform-origin:center}
.leaf:hover .shape,.leaf:focus-visible .shape{transform:scale(1.35);filter:drop-shadow(0 0 6px rgba(255,200,120,.95))}
.leaf.grow .shape{animation:grow 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.leaf.spot .shape{animation:pulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,190,90,1))}
@keyframes pulse{0%,100%{transform:scale(1.3)}50%{transform:scale(1.6)}}
.sway{animation:sway 7s ease-in-out infinite;transform-box:view-box;transform-origin:500px 930px}
@keyframes sway{0%,100%{transform:rotate(-.35deg)}50%{transform:rotate(.35deg)}}
svg.filtering .leaf:not(.match) .shape{opacity:.12}
svg.filtering .leaf.match .shape{filter:drop-shadow(0 0 8px rgba(255,190,90,1))}
.seg-in{animation:segin 1.1s ease-out both}
@keyframes segin{from{opacity:0}to{opacity:1}}

/* Thẻ trạng thái: tổng số lời chúc + tiến độ cây */
.status{position:absolute;left:var(--gutter);top:6px;z-index:4;display:flex;align-items:center;gap:16px;width:370px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow-sm)}
.st-count{text-align:center;padding-right:16px;border-right:1px solid var(--line);min-width:92px}
.st-count b{display:block;font-size:40px;line-height:1;font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums}
.st-count span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.st-growth{flex:1;min-width:0}
.st-stage{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
.st-stage svg{width:18px;height:18px;flex:0 0 auto}
.bar{height:8px;border-radius:9px;background:#f1e6e8;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7DB65A,var(--leaf));border-radius:9px;transition:width 1s}
.st-next{font-size:12.5px;color:var(--muted);line-height:1.4}
.status.bump .st-count b{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.18)}}

/* Gợi ý chạm lá */
.tap-hint{position:absolute;left:var(--tree-center);bottom:22px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);transition:opacity .5s,transform .5s;white-space:nowrap}
.tap-hint.gone{opacity:0;transform:translate(-50%,10px);pointer-events:none}
.tap-hint span{animation:tap 1.4s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(-3px)}}

/* Trạng thái trống */
.empty{position:absolute;left:var(--tree-center);top:42%;transform:translate(-50%,-50%);z-index:4;width:min(400px,calc(100vw - 40px));text-align:center;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;padding:24px 24px 22px;box-shadow:var(--shadow)}
.empty .e-ico{font-size:40px}
.empty h3{margin:6px 0 6px;font-size:19px}
.empty p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}

/* Cánh hoa rơi */
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.petals span{position:absolute;top:-30px;background:radial-gradient(circle at 30% 30%,#ffd1da,#ff6f8c 60%,#E4002B);border-radius:80% 10% 80% 10%;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-20px,0) rotate(0)}25%{transform:translate3d(30px,25vh,0) rotate(120deg)}50%{transform:translate3d(-20px,50vh,0) rotate(220deg)}75%{transform:translate3d(25px,75vh,0) rotate(300deg)}100%{transform:translate3d(-10px,105vh,0) rotate(400deg)}}

/* Thẻ lời chúc */
#card{position:fixed;left:var(--tree-center);bottom:22px;transform:translate(-50%,calc(100% + 140px));width:min(560px,calc(100vw - 32px));background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px 16px 26px;transition:transform .5s cubic-bezier(.2,.9,.2,1);z-index:30;overflow:hidden}
#card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--brand))}
#card.show{transform:translate(-50%,0)}
#card .q{position:absolute;right:56px;top:16px;width:54px;height:45px;color:var(--brand);opacity:.1;pointer-events:none}
#card .to{font-size:13px;font-weight:700;color:var(--accent,var(--brand));letter-spacing:.2px;text-transform:uppercase;padding-right:40px}
#card blockquote{margin:10px 0 12px;font-size:18px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;max-height:40vh;overflow:auto;color:var(--ink-2)}
#card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
#card .nav{display:flex;gap:6px}
#card .nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px}
#card .nav button:hover{border-color:var(--brand);color:var(--brand)}
#card .close{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:26px;cursor:pointer;color:var(--muted);z-index:1;width:36px;height:36px;border-radius:50%}
#card .close:hover{background:var(--brand-tint)}
#card .peek-hint{display:none;color:var(--brand);font-weight:500}
#card.peek{cursor:pointer}
#card.peek .nav,#card.peek .close{display:none}
#card.peek .peek-hint{display:inline}

#feed{display:none}

/* Modal */
.modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.show{display:flex}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);width:min(560px,100%);padding:26px;max-height:calc(100vh - 32px);overflow:auto;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 6px;font-size:22px;font-weight:700}
.panel .sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.panel .sub svg{flex:0 0 auto;width:18px;height:18px;color:var(--leaf);margin-top:1px}
.field{margin-bottom:16px}
.field .lbl{display:block;font-weight:500;font-size:14px;margin-bottom:7px}
.field input[type=text],.field input[type=password],.field select,.field textarea{width:100%;border:1px solid #E2DCDC;background:#fff;border-radius:12px;padding:12px 13px;outline:0;transition:border-color .2s,box-shadow .2s;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(228,0,43,.12)}
.field textarea{min-height:130px;resize:vertical;line-height:1.55}
.seg-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-ctl label{border:1px solid #E2DCDC;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;font-size:14px;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.seg-ctl label .ico{font-size:20px}
.seg-ctl label small{font-size:11px;color:var(--muted)}
.seg-ctl input{position:absolute;opacity:0;pointer-events:none}
.seg-ctl label:has(input:checked){border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark);font-weight:500}
.seg-ctl label:has(input:focus-visible){outline:3px solid rgba(228,0,43,.35)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ideas button{border:1px dashed #E2C7CC;background:var(--brand-tint);color:var(--brand-dark);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.ideas button:hover{border-style:solid}
.hint{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.err{color:var(--brand-dark);font-size:14px;min-height:20px;margin:4px 0}
.ok-box{text-align:center;padding:8px 0}
.ok-box .sprout{width:76px;height:76px;margin:0 auto 10px}

/* Cổng PIN */
#gate .panel{text-align:center;width:min(440px,100%)}
#gate .logo-img{height:26px;margin:4px auto 16px}
#gate .hello{font-size:15px;color:var(--muted);margin:0}
#gate h2{font-size:30px;font-weight:900;margin-top:2px}
#gate input{text-align:center;font-size:20px;letter-spacing:4px}
#gate .tiny{font-size:12px;color:var(--muted);margin-top:14px;display:flex;justify-content:center;gap:6px;align-items:center}

/* Toast */
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,calc(-100% - 40px));background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:50;transition:transform .4s;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}

/* Nút gửi cố định cho điện thoại */
.fab{display:none}

/* Trình chiếu */
#show{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:48px;text-align:center;background:radial-gradient(1200px 600px at 50% 0%,#FFE3E8 0%,transparent 70%),radial-gradient(900px 500px at 100% 100%,#F3F7EA 0%,transparent 60%),#FFFBF9;overflow:hidden}
#show.show{display:flex}
#show .s-top{position:absolute;top:28px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center}
#show .s-top img{height:30px}
#show .s-title{font-size:clamp(28px,3.4vw,54px);font-weight:900;margin:0 0 3vh;letter-spacing:-.5px}
#show .s-to{display:inline-block;font-weight:700;font-size:clamp(14px,1.5vw,22px);text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--brand);padding:8px 18px;border-radius:999px}
#show .s-text{font-size:clamp(24px,3.4vw,56px);line-height:1.45;font-weight:300;max-width:1300px;margin:4vh 0;white-space:pre-wrap;word-wrap:break-word;transition:opacity .6s,transform .6s}
#show .s-text.fade{opacity:0;transform:translateY(10px)}
#show .s-foot{color:var(--muted);font-size:clamp(13px,1.2vw,18px)}
#show .s-progress{position:absolute;left:0;bottom:0;height:5px;background:var(--brand);width:0}

/* Màn rộng: cột lời chúc mới nhất */
@media (min-width:1500px){
  :root{--feed-w:calc(var(--gutter) + 410px)}
  #feed{display:flex;flex-direction:column;position:absolute;top:6px;bottom:20px;right:var(--gutter);width:390px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
  #feed h3{margin:0;padding:18px 20px 12px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  #feed .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--brand)}
  #feed .live i{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  #feedList{list-style:none;margin:0;padding:6px 10px 10px;overflow:auto;flex:1}
  #feedList li{padding:13px 12px;border-radius:14px;cursor:pointer;border-bottom:1px solid #F3EEEE;transition:background .2s}
  #feedList li:hover{background:var(--brand-tint)}
  #feedList li.new{animation:feedIn .9s ease-out}
  @keyframes feedIn{from{background:#FFE9C7;transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  #feedList .f-to{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.3px}
  #feedList .f-to i{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);flex:0 0 auto}
  #feedList .f-to i.fl{border-radius:50%}
  #feedList .f-text{font-size:15px;line-height:1.5;margin-top:5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #feedList .f-time{font-size:12px;color:var(--muted);margin-top:5px}
  #feedList .f-empty{color:var(--muted);cursor:default}
  .stage{padding-right:var(--feed-w)}
}
@media (min-width:1800px){
  :root{--feed-w:calc(var(--gutter) + 454px)}
  .brand .logo-img{height:28px} .brand h1{font-size:32px} .brand p{font-size:15px}
  .cd{font-size:15px;padding:10px 24px} .cd-n b{font-size:26px}
  .btn{font-size:16px;padding:12px 22px}
  .search input{font-size:16px} .chip{font-size:14px;padding:7px 13px}
  .status{width:410px;padding:16px 20px} .st-count b{font-size:46px} .st-stage{font-size:16px} .st-next{font-size:13.5px}
  #card{width:640px;padding:26px 30px 18px 32px} #card blockquote{font-size:21px} #card .to{font-size:14px}
  #feed{width:430px}
  #feedList .f-text{font-size:16px}
}
/* Màn vừa và nhỏ: thẻ trạng thái nằm dưới cây */
@media (max-width:1099px){
  header{grid-template-columns:1fr auto;grid-template-areas:"brand actions" "cd cd"}
  .brand{grid-area:brand} .actions{grid-area:actions} .cd{grid-area:cd;justify-self:start}
  .status{position:relative;left:auto;top:auto;width:auto;margin:-6px 16px 18px}
  .tap-hint{top:10px;bottom:auto}
  .tap-hint.gone{transform:translate(-50%,-10px)}
}
/* Điện thoại */
@media (max-width:640px){
  header{grid-template-columns:1fr;grid-template-areas:"brand" "cd";padding:14px 16px 4px;gap:12px}
  .actions{display:none}
  .brand{gap:12px} .brand .logo-img{height:18px} .brand .sep{height:30px} .brand h1{font-size:22px} .brand p{font-size:12px}
  .cd{justify-self:stretch;border-radius:16px;padding:9px 12px;gap:2px 8px;font-size:13px}
  .cd-n b{font-size:19px}
  .toolbar{padding:0 16px}
  .search{flex:1 1 100%;flex-wrap:wrap;border-radius:18px;padding:6px 8px 6px 14px}
  .search input{flex:1 1 60%;font-size:16px}
  .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chip{flex:0 0 auto}
  #tree{max-height:none;min-height:0}
  .status{gap:12px;padding:12px 14px}

<script>
/* Toàn bộ thông tin và chữ hiển thị nằm trong config.js */
const CFG = window.SITE_CONFIG || {};
const TXT = CFG.text || {};
const COMPANY = (CFG.company && CFG.company.name) || "";
const EVT = CFG.event || {};
const EVENT_NAME = [EVT.title, EVT.titleHighlight].filter(Boolean).join(" ");
const DEPARTMENTS = CFG.departments || [];
const TIMING = Object.assign({refresh:45, spotlight:6, slide:9}, CFG.timing || {});
const API_URL = ((CFG.backend && CFG.backend.apiUrl) || "").trim();
const PREVIEW = !API_URL;

function t(key, vars={}){
  const s = TXT[key]; if (s == null) return "";
  const all = Object.assign({company:COMPANY, event:EVENT_NAME}, vars);
  return String(s).replace(/\{(\w+)\}/g, (m,k)=> all[k] != null ? all[k] : m);
}
const fill = s => String(s).replace(/\{company\}/g, COMPANY).replace(/\{event\}/g, EVENT_NAME);

const BRAND = "#E4002B";
const PALETTE = ["#2F7D57","#1F8A8A","#7DB65A","#D9A441","#E8743B","#3D6FB6","#7B5BA6","#C2185B","#4C9A6A","#00897B","#AFB42B","#5C6BC0"];
const deptIndex = d => { const i = DEPARTMENTS.indexOf(d); return i >= 0 ? i % PALETTE.length : hash(d) % PALETTE.length; };
const deptColor = d => PALETTE[deptIndex(d)];

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs={}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed>>>15, 1|seed); x = x + Math.imul(x ^ x>>>7, 61|x) ^ x; return ((x ^ x>>>14)>>>0)/4294967296; }; }
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").trim();
function save(k,v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function toast(msg){ const x=$("#toast"); x.textContent=msg; x.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("show"),4200); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); const r=n>>16, g=n>>8&255, b=n&255;
  const f = v => Math.round(amt<0 ? v*(1+amt) : v + (255-v)*amt);
  return "#" + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function target(m){
  if (m.toType==="person") return m.toName + (m.toDept ? " · " + m.toDept : "");
  if (m.toType==="dept") return m.toDept;
  return COMPANY;
}
function recipient(m){
  if (m.toType==="person") return t("toPerson",{to:target(m)});
  if (m.toType==="dept") return t("toDept",{to:target(m)});
  return t("toCompany");
}
const colorOf = m => m.toType==="company" ? BRAND : deptColor(m.toDept);
function timeAgo(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = (Date.now()-d)/1000;
  if (s<60) return "vừa xong"; if (s<3600) return Math.floor(s/60)+" phút trước";
  if (s<86400) return Math.floor(s/3600)+" giờ trước";
  return d.toLocaleDateString("vi-VN");
}

/* ---------- áp dụng chữ từ config ---------- */
function applyTexts(){
  document.title = t("pageTitle");
  $$("[data-t]").forEach(n=>{ n.textContent = t(n.dataset.t); });
  $$("[data-ph]").forEach(n=>{ n.placeholder = t(n.dataset.ph); });
  $$(".event-title").forEach(n=>{ n.innerHTML = `${esc(EVT.title||"")} <span class="hl">${esc(EVT.titleHighlight||"")}</span>`; });
  $$(".logo-img").forEach(n=>{ if (CFG.company && CFG.company.logo) n.src = CFG.company.logo; n.alt = COMPANY; });
  $("#tree").setAttribute("aria-label", EVENT_NAME);
  const st = esc(t("showTitle")), hl = esc(EVT.titleHighlight||"");
  $("#sTitle").innerHTML = hl ? st.replace(hl, `<span class="hl">${hl}</span>`) : st;
  $("#gateSub").textContent = PREVIEW ? t("gatePreviewText") : t("gateText");
  $("#pinBtn").textContent = t("gateButton");
}

/* ---------- API ---------- */
let PIN = load("cta_pin") || "";
async function api(action, data={}){
  if (PREVIEW) return previewApi(action, data);
  const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action, pin: PIN, ...data }) });
  if (!res.ok) throw new Error(t("netError"));
  return res.json();
}

/* ---------- lời chúc mẫu (bản xem trước) ---------- */
let sample = null;
function previewApi(action, data){
  if (!sample){
    const P = CFG.previewSamples || {}, texts = (P.texts||[]).map(fill), names = P.names||[], r = rng(11);
    sample = Array.from({length: texts.length ? (P.count||60) : 0}, (_,i)=>{
      const x = r(), dept = DEPARTMENTS[Math.floor(r()*DEPARTMENTS.length)] || "";
      const toType = x<.33 || !dept ? "company" : x<.68 || !names.length ? "dept" : "person";
      return { id:"p"+i, time:new Date(Date.now()-r()*6*864e5).toISOString(), toType,
        toDept: toType==="company" ? "" : dept, toName: toType==="person" ? names[Math.floor(r()*names.length)] : "",
        text: texts[Math.floor(r()*texts.length)] };
    });
  }
  if (action==="verify") return Promise.resolve({ok:true});
  if (action==="list") return Promise.resolve({ok:true, items: sample.slice()});
  if (action==="submit"){
    const m = { id:"p"+Date.now(), time:new Date().toISOString(), toType:data.toType,
      toDept: data.toType==="company" ? "" : data.toDept, toName: data.toType==="person" ? data.toName : "", text:data.text };
    sample.push(m); return Promise.resolve({ok:true, id:m.id});
  }
}

/* ---------- cây ---------- */
const MAXD = 7, BASE = {x:500, y:930};
const SEGS = (function buildTree(){
  const r = rng(20261121), segs = [];
  (function branch(x,y,ang,len,w,depth){
    const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
    const bend = (r()-.5)*len*.22;
    const w2 = depth>=MAXD ? Math.max(1.2,w*.45) : depth===0 ? w*.8 : Math.max(1.4,w*.66);
    segs.push({x1:x,y1:y,x2,y2,cx:(x+x2)/2+Math.cos(ang+Math.PI/2)*bend,cy:(y+y2)/2+Math.sin(ang+Math.PI/2)*bend,w,w2,depth,ang});
    if (depth>=MAXD) return;
    const n = depth<1 ? 2 : (r()<.3 ? 3 : 2);
    for (let i=0;i<n;i++){
      const spread = .3 + r()*.3;
      let a = n===2 ? ang + (i ? spread : -spread) : ang + (i-1)*spread*1.1;
      a += (r()-.5)*.22;
      a = a*.84 + (-Math.PI/2)*.16;
      branch(x2,y2,a,len*(.7+r()*.12),w2,depth+1);
    }
  })(BASE.x, BASE.y, -Math.PI/2, 195, 54, 0);
  return segs;
})();

/* giai đoạn: tên và mốc lấy từ config, độ lớn tính tự động */
const STAGES = (function(){
  const src = (CFG.stages && CFG.stages.length) ? CFG.stages.slice().sort((a,b)=>a.min-b.min) : [{min:0,name:""}];
  const n = src.length;
  return src.map((s,i)=>({ min:s.min, name:s.name,
    depth: n===1 ? MAXD : Math.max(1, Math.round(1 + i*(MAXD-1)/(n-1))),
    scale: n===1 ? 1 : .42 + i*(.58/(n-1)) }));
})();
const stageIdx = n => STAGES.reduce((k,x,i)=> n>=x.min ? i : k, 0);

let items = [], byId = new Map(), currentStage = null, leafEls = new Map(), loaded = false;

function buildLeafGradients(){
  const g = $("#leafGrads");
  PALETTE.forEach((c,i)=>{
    const lg = el("linearGradient",{id:"lg"+i, x1:"0", y1:"0", x2:"1", y2:"1"});
    lg.append(el("stop",{offset:"0%","stop-color":shade(c,.35)}), el("stop",{offset:"55%","stop-color":c}), el("stop",{offset:"100%","stop-color":shade(c,-.28)}));
    g.appendChild(lg);
  });
}
function buildGrass(){
  const g = $("#grass"), r = rng(5);
  for (let i=0;i<46;i++){
    const x = 180 + r()*640, y = 930 + r()*40, k = .6 + r()*.6, col = r()<.5 ? "#7FAE62" : "#6E9F55";
    [-1,0,1].forEach(j=>{ const h=(6+r()*6)*k, lean=j*3*k+(r()-.5)*2;
      g.appendChild(el("path",{d:`M${(x+j*1.5).toFixed(1)},${y.toFixed(1)} q${(lean*.3).toFixed(1)},${(-h*.6).toFixed(1)} ${lean.toFixed(1)},${(-h).toFixed(1)}`, stroke:col, "stroke-width":"1.2", fill:"none", "stroke-linecap":"round", opacity:".7"})); });
  }
}
function segPath(s){
  const nx = -Math.sin(s.ang), ny = Math.cos(s.ang);
  const h1 = s.w/2, h2 = s.w2/2, hm = (h1+h2)/2;
  const p = (x,y,k)=>`${(x+nx*k).toFixed(1)},${(y+ny*k).toFixed(1)}`;
  return `M${p(s.x1,s.y1,h1)} Q${p(s.cx,s.cy,hm)} ${p(s.x2,s.y2,h2)} L${p(s.x2,s.y2,-h2)} Q${p(s.cx,s.cy,-hm)} ${p(s.x1,s.y1,-h1)} Z`;
}
function drawTree(stage){
  const g = $("#branches"); g.textContent = "";
  g.appendChild(el("path",{d:`M${BASE.x-48},${BASE.y+6} C${BASE.x-30},${BASE.y-6} ${BASE.x-22},${BASE.y-30} ${BASE.x-21},${BASE.y-60} L${BASE.x+21},${BASE.y-60} C${BASE.x+22},${BASE.y-30} ${BASE.x+30},${BASE.y-6} ${BASE.x+52},${BASE.y+6} Z`, fill:"url(#bark)"}));
  SEGS.filter(s=>s.depth<=stage.depth).sort((a,b)=>a.depth-b.depth).forEach(s=>{
    const p = el("path",{d:segPath(s), fill:"url(#bark)", class:"seg-in"});
    p.style.animationDelay = (s.depth*.07)+"s";
    g.appendChild(p);
    if (s.depth < stage.depth) g.appendChild(el("circle",{cx:s.x2.toFixed(1), cy:s.y2.toFixed(1), r:(s.w2/2).toFixed(1), fill:"#6E4630"}));
  });
  const sc = stage.scale;
  $("#treeScale").setAttribute("transform",`translate(${BASE.x*(1-sc)},${BASE.y*(1-sc)}) scale(${sc})`);
  const top = Math.min(...SEGS.filter(s=>s.depth<=stage.depth).map(s=>BASE.y*(1-sc)+s.y2*sc));
  const h = Math.min(980, Math.max(560, 980 - (top - 120)));
  const w = h*1000/980;
  $("#tree").setAttribute("viewBox", `${(500-w/2).toFixed(0)} ${(980-h).toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}`);
}
function leafShape(m, size, r){
  const g = el("g",{class:"shape"});
  if (m.toType==="company"){
    const s = size*.62;
    for (let i=0;i<5;i++){
      g.appendChild(el("path",{d:`M0,0 C${-s*.55},${-s*.25} ${-s*.6},${-s*.95} 0,${-s*1.05} C${s*.6},${-s*.95} ${s*.55},${-s*.25} 0,0 Z`, fill:"url(#petal)", transform:`rotate(${i*72 + r()*8})`, stroke:"rgba(160,0,30,.18)", "stroke-width":".6"}));
    }
    g.appendChild(el("circle",{r:(s*.26).toFixed(1), fill:"#FFD36B"}));
    for (let i=0;i<6;i++){ const a=i*60*Math.PI/180; g.appendChild(el("circle",{cx:(Math.cos(a)*s*.2).toFixed(1), cy:(Math.sin(a)*s*.2).toFixed(1), r:(s*.06).toFixed(1), fill:"#B8741A"})); }
  } else {
    const s = size, k = deptIndex(m.toDept), bulge = .36 + r()*.12;
    g.appendChild(el("path",{d:`M0,0 C${s*.25},${-s*bulge} ${s*.8},${-s*bulge*1.05} ${s*1.25},0 C${s*.8},${s*bulge*1.05} ${s*.25},${s*bulge} 0,0 Z`, fill:`url(#lg${k})`, stroke:shade(PALETTE[k],-.35), "stroke-width":".7", "stroke-opacity":".5"}));
    g.appendChild(el("path",{d:`M${s*.04},0 Q${s*.6},${-s*.04} ${s*1.12},0`, stroke:"rgba(255,255,255,.6)", "stroke-width":"1.1", fill:"none"}));
    for (let i=1;i<=3;i++){ const x=s*(.25*i); g.appendChild(el("path",{d:`M${x},0 l${s*.12},${-s*.13} M${x},0 l${s*.12},${s*.13}`, stroke:"rgba(255,255,255,.35)", "stroke-width":".8", fill:"none"})); }
  }
  return g;
}
function placeLeaf(m, stage, cands){
  const h = hash(m.id), r = rng(h);
  const s = cands[h % cands.length];
  const tt = .25 + r()*.75, u = 1-tt;
  const x = u*u*s.x1 + 2*u*tt*s.cx + tt*tt*s.x2, y = u*u*s.y1 + 2*u*tt*s.cy + tt*tt*s.y2;
  const side = r()<.5 ? -1 : 1, off = ((s.w+s.w2)/4 + 1 + r()*12) * side;
  const px = x + -Math.sin(s.ang)*off, py = y + Math.cos(s.ang)*off;
  const rot = (s.ang*180/Math.PI) + side*(30+r()*50);
  const size = (m.toType==="company" ? 22 : 21) / stage.scale;
  return {x:px, y:py, rot, size, r};
}

function renderStatus(bump){
  const idx = stageIdx(items.length), stage = STAGES[idx], next = STAGES[idx+1];
  $("#countNum").textContent = items.length.toLocaleString("vi-VN");
  $("#gName").textContent = stage.name;
  if (next){
    const pct = (items.length - stage.min) / (next.min - stage.min) * 100;
    $("#gBar").style.width = Math.max(4,pct).toFixed(0)+"%";
    $("#gNext").textContent = t("statusNext",{n: next.min - items.length, next: next.name});
  } else { $("#gBar").style.width = "100%"; $("#gNext").textContent = t("statusDone"); }
  if (bump){ const s=$("#status"); s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump"); }
  $("#empty").hidden = !(loaded && items.length===0);
}

function renderLeaves(fresh=new Set()){
  const stage = STAGES[stageIdx(items.length)];
  if (!currentStage || stage.depth!==currentStage.depth || stage.scale!==currentStage.scale){ drawTree(stage); currentStage = stage; }
  renderStatus(fresh.size>0);
  const minDepth = Math.max(1, stage.depth-2);
  const cands = SEGS.filter(s=>s.depth<=stage.depth && s.depth>=Math.min(minDepth, stage.depth));
  const g = $("#leaves"); g.textContent = ""; leafEls.clear();
  const ordered = items.filter(m=>m.toType!=="company").concat(items.filter(m=>m.toType==="company"));
  ordered.forEach(m=>{
    const pos = placeLeaf(m, stage, cands), isF = m.toType==="company";
    const node = el("g",{class:"leaf"+(isF?" flower":"")+(fresh.has(m.id)?" grow":""), transform:`translate(${pos.x.toFixed(1)},${pos.y.toFixed(1)}) rotate(${isF ? (pos.r()*72).toFixed(0) : pos.rot.toFixed(1)})`, tabindex:"0", role:"button", "aria-label":recipient(m)});
    node.dataset.id = m.id;
    node.appendChild(leafShape(m, pos.size, pos.r));
    g.appendChild(node); leafEls.set(m.id, node);
  });
  applyFilter();
}

/* ---------- gợi ý chạm lá ---------- */
let hintDone = load("cta_hint") === "1";
function hideHint(){ $("#tapHint").classList.add("gone"); if (!hintDone){ hintDone = true; save("cta_hint","1"); } }
function maybeShowHint(){ if (hintDone || !items.length) return; $("#tapHint").classList.remove("gone"); setTimeout(hideHint, 9000); }

/* ---------- thẻ lời chúc ---------- */
let cardList = [], cardIdx = -1, cardMode = null, peekTimer = null;
function showCard(m, mode, list){
  if (mode==="open") hideHint(); else $("#tapHint").classList.add("gone");
  cardMode = mode; cardList = list || items; cardIdx = cardList.findIndex(x=>x.id===m.id);
  const c = $("#card"); c.style.setProperty("--accent", colorOf(m));
  $("#cardTo").textContent = recipient(m);
  $("#cardText").textContent = m.text;
  $("#cardMeta").textContent = timeAgo(m.time) + (mode==="open" && cardList.length>1 ? ` · ${cardIdx+1}/${cardList.length}` : "");
  c.classList.toggle("peek", mode==="peek"); c.classList.add("show");
  $$(".leaf.spot").forEach(e=>e.classList.remove("spot"));
  const le = leafEls.get(m.id); if (le) le.classList.add("spot");
  clearTimeout(peekTimer);
  if (mode==="peek") peekTimer = setTimeout(hideCard, (TIMING.spotlight-1)*1000);
}
function hideCard(){ $("#card").classList.remove("show"); cardMode = null; $$(".leaf.spot").forEach(e=>e.classList.remove("spot")); }
function stepCard(d){ if (!cardList.length) return; cardIdx = (cardIdx + d + cardList.length) % cardList.length; showCard(cardList[cardIdx], "open", cardList); }
$("#card").addEventListener("click", ()=>{ if (cardMode==="peek"){ const m = cardList[cardIdx]; if (m) showCard(m,"open",items); } });
$("#cardClose").onclick = e=>{ e.stopPropagation(); hideCard(); };
$("#cardPrev").onclick = e=>{ e.stopPropagation(); stepCard(-1); };
$("#cardNext").onclick = e=>{ e.stopPropagation(); stepCard(1); };
const openLeaf = e=>{ const n = e.target.closest(".leaf"); if (!n) return; const m = byId.get(n.dataset.id); if (m) showCard(m,"open",filtered()||items); };
$("#leaves").addEventListener("click", openLeaf);
$("#leaves").addEventListener("keydown", e=>{ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openLeaf(e); } });

let spotAfter = Date.now() + 10000;
setInterval(()=>{
  if (Date.now() < spotAfter || !items.length || document.hidden || cardMode==="open" || anyModal() || $("#show").classList.contains("show")) return;
  const pool = filtered() || items; if (!pool.length) return;
  showCard(pool[Math.floor(Math.random()*pool.length)], "peek", pool);
}, TIMING.spotlight*1000);

/* ---------- tìm kiếm, chú thích ---------- */
let activeDept = null;
function filtered(){
  const q = norm($("#q").value);
  if (!q && !activeDept) return null;
  return items.filter(m=>{
    if (activeDept) return activeDept==="__company" ? m.toType==="company" : m.toDept===activeDept;
    return norm(m.toName).includes(q) || norm(m.toDept).includes(q) || (m.toType==="company" && norm(COMPANY+" ca cong ty").includes(q));
  });
}
function applyFilter(){
  const f = filtered();
  $("#tree").classList.toggle("filtering", !!f);
  const ids = new Set((f||[]).map(m=>m.id));
  leafEls.forEach((n,id)=>n.classList.toggle("match", ids.has(id)));
  $("#qCount").textContent = f ? (f.length ? t("searchCount",{n:f.length}) : t("searchNone")) : "";
  $("#qBrowse").hidden = !f || !f.length; $("#qClear").hidden = !f;
  $$(".chip").forEach(c=>c.classList.toggle("on", c.dataset.dept===activeDept));
}
function buildLegend(){
  const L = $("#legend"); L.textContent = "";
  const mk = (label,color,key,cls)=>{
    const c = document.createElement("button"); c.className="chip"+(cls?" "+cls:""); c.dataset.dept=key;
    const i = document.createElement("i"); i.style.background=color; c.appendChild(i); c.appendChild(document.createTextNode(label));
    c.onclick = ()=>{ activeDept = activeDept===key ? null : key; $("#q").value=""; applyFilter(); };
    L.appendChild(c);
  };
  mk(t("legendCompany"), BRAND, "__company", "flower");
  DEPARTMENTS.forEach(d=>mk(d, deptColor(d), d));
}
function updateNames(){
  const set = new Set(DEPARTMENTS); items.forEach(m=>{ if (m.toName) set.add(m.toName); });
  const dl = $("#names"); dl.textContent = "";
  [...set].sort((a,b)=>a.localeCompare(b,"vi")).forEach(n=>{ const o=document.createElement("option"); o.value=n; dl.appendChild(o); });
}
$("#q").addEventListener("input", ()=>{ activeDept=null; applyFilter(); });
$("#qClear").onclick = ()=>{ $("#q").value=""; activeDept=null; applyFilter(); hideCard(); };
$("#qBrowse").onclick = ()=>{ const f = filtered(); if (f && f.length) showCard(f[0],"open",f); };

/* ---------- cột lời chúc mới nhất ---------- */
function renderFeed(fresh=new Set()){
  const ul = $("#feedList"); ul.textContent = "";
  const latest = items.slice().sort((a,b)=>String(b.time).localeCompare(String(a.time))).slice(0,30);
  latest.forEach(m=>{
    const li = document.createElement("li"); if (fresh.has(m.id)) li.className = "new";
    const to = document.createElement("div"); to.className="f-to"; to.style.color = shade(colorOf(m),-.15);
    const dot = document.createElement("i"); dot.style.background = colorOf(m); if (m.toType==="company") dot.className="fl";
    to.append(dot, document.createTextNode(recipient(m)));
    const tx = document.createElement("div"); tx.className="f-text"; tx.textContent = m.text;
    const tm = document.createElement("div"); tm.className="f-time"; tm.textContent = timeAgo(m.time);
    li.append(to, tx, tm); li.onclick = ()=>showCard(m,"open",items); ul.appendChild(li);
  });
  if (!latest.length){ const li=document.createElement("li"); li.className="f-empty"; li.textContent=t("feedEmpty"); ul.appendChild(li); }
}

/* ---------- gửi lời chúc ---------- */
function anyModal(){ return !!document.querySelector(".modal.show"); }
function openModal(id){ $(id).classList.add("show"); }
function closeModals(){ $$(".modal.show").forEach(m=>{ if (m.id!=="gate") m.classList.remove("show"); }); }
$$("[data-close]").forEach(b=>b.onclick = closeModals);
$$(".modal").forEach(m=>m.addEventListener("click", e=>{ if (e.target===m && m.id!=="gate") closeModals(); }));
DEPARTMENTS.forEach(d=>{ const o=document.createElement("option"); o.value=o.textContent=d; $("#toDept").appendChild(o); });
$$("input[name=toType]").forEach(r=>r.addEventListener("change", syncType));
function syncType(){
  const tp = document.querySelector("input[name=toType]:checked").value;
  $("#fDept").hidden = tp==="company"; $("#fName").hidden = tp!=="person";
  const box = $("#ideas"); box.textContent = "";
  ((CFG.ideas||{})[tp]||[]).map(fill).forEach(s=>{ const b=document.createElement("button"); b.type="button"; b.textContent = s.trim()+"…";
    b.onclick = ()=>{ const ta=$("#msg"); ta.value = s; ta.focus(); ta.setSelectionRange(s.length,s.length); ta.dispatchEvent(new Event("input")); };
    box.appendChild(b); });
}
$("#msg").addEventListener("input", ()=>{ $("#msgCount").textContent = $("#msg").value.length + "/500"; });
function openSend(){ $("#sendForm").hidden=false; $("#sendDone").hidden=true; $("#sendErr").textContent=""; hideCard(); openModal("#sendModal"); setTimeout(()=>$("#msg").focus(),60); }
$$(".js-send").forEach(b=>b.onclick = openSend);
$("#sendAgain").onclick = ()=>{ $("#sendForm").hidden=false; $("#sendDone").hidden=true; $("#msg").focus(); };
$("#shareBtn").onclick = async ()=>{
  const url = location.href.split("#")[0].split("?")[0];
  const text = t("inviteText",{url});
  try{ if (navigator.share) await navigator.share({title:EVENT_NAME, text, url}); else { await navigator.clipboard.writeText(text); toast(t("inviteCopied")); } }
  catch(e){ if (e && e.name!=="AbortError") toast(url); }
};
$("#sendBtn").onclick = async ()=>{
  const toType = document.querySelector("input[name=toType]:checked").value;
  const data = { toType, toDept: $("#toDept").value, toName: $("#toName").value.trim(), text: $("#msg").value.trim() };
  if (toType==="person" && !data.toName) return $("#sendErr").textContent = t("errName");
  if (data.text.length < 5) return $("#sendErr").textContent = t("errShort");
  const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = t("btnSubmitting"); $("#sendErr").textContent="";
  try{
    const res = await api("submit", data);
    if (!res.ok) throw new Error(res.error || t("errSend"));
    $("#msg").value=""; $("#toName").value=""; $("#msgCount").textContent="0/500";
    $("#sendForm").hidden=true; $("#sendDone").hidden=false;
    $("#sendDoneText").textContent = PREVIEW ? t("donePreviewText") : (res.approved ? "" : t("doneText"));
    refresh(true);
  }catch(err){ $("#sendErr").textContent = err.message || t("errSend"); }
  finally{ btn.disabled=false; btn.textContent=t("btnSubmit"); }
};

/* ---------- trình chiếu ---------- */
let showTimer = null, showIdx = 0, showList = [];
function startShow(){
  if (!items.length) return toast(t("showEmpty"));
  hideCard(); showList = items.slice().sort(()=>Math.random()-.5); showIdx = 0;
  $("#show").classList.add("show");
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  renderSlide(); clearInterval(showTimer);
  showTimer = setInterval(()=>{ showIdx=(showIdx+1)%showList.length; renderSlide(); }, TIMING.slide*1000);
}
function renderSlide(){
  const m = showList[showIdx], x = $("#sText"), p = $("#sProg");
  x.classList.add("fade"); p.style.transition = "none"; p.style.width = "0";
  setTimeout(()=>{
    $("#sTo").textContent = recipient(m); $("#sTo").style.background = colorOf(m);
    x.textContent = "“" + m.text + "”";
    $("#sFoot").textContent = `${showIdx+1} / ${t("showCount",{n:showList.length})}`;
    x.classList.remove("fade");
    p.style.transition = `width ${TIMING.slide-0.4}s linear`; p.style.width = "100%";
  }, 380);
}
function stopShow(){ clearInterval(showTimer); $("#show").classList.remove("show"); try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){} }
$("#btnShow").onclick = startShow; $("#showClose").onclick = stopShow;
document.addEventListener("keydown", e=>{
  const on = $("#show").classList.contains("show");
  if (e.key==="Escape"){ if (on) stopShow(); else { closeModals(); hideCard(); } }
  if (on && (e.key==="ArrowRight"||e.key===" ")){ e.preventDefault(); showIdx=(showIdx+1)%showList.length; renderSlide(); }
  if (on && e.key==="ArrowLeft"){ showIdx=(showIdx-1+showList.length)%showList.length; renderSlide(); }
});

/* ---------- tải dữ liệu ---------- */
async function refresh(silent){
  try{
    const res = await api("list");
    if (!res.ok){ if (res.code==="BAD_PIN"){ save("cta_pin"); PIN=""; started=false; showGate(t("pinChanged")); } return; }
    const incoming = res.items || [], fresh = new Set(), first = !loaded;
    if (!first) incoming.forEach(m=>{ if (!byId.has(m.id)) fresh.add(m.id); });
    items = incoming.sort((a,b)=> String(a.time).localeCompare(String(b.time)));
    byId = new Map(items.map(m=>[m.id,m]));
    loaded = true;
    renderLeaves(fresh); renderFeed(fresh); updateNames();
    if (first) maybeShowHint();
    if (fresh.size){
      const last = items.find(m=>fresh.has(m.id));
      toast(fresh.size===1 ? t("toastNewOne",{to:target(last)}) : t("toastNewMany",{n:fresh.size}));
    }
  }catch(e){ if (!silent) toast(t("loadError")); }
}

/* ---------- đếm ngược ---------- */
function setupCountdown(){
  const when = new Date(EVT.birthday), box = $("#countdownBox");
  if (isNaN(when)) { box.hidden = true; return; }
  const dateStr = when.toLocaleDateString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit",year:"numeric"});
  $("#countdownLbl").textContent = t("countdownAfter",{date:dateStr});
  const pad = n => String(n).padStart(2,"0");
  (function tick(){
    const ms = when - Date.now();
    if (ms > 0){
      const s = Math.floor(ms/1000);
      $("#cdD").textContent = Math.floor(s/86400); $("#cdH").textContent = pad(Math.floor(s%86400/3600));
      $("#cdM").textContent = pad(Math.floor(s%3600/60)); $("#cdS").textContent = pad(s%60);
    } else if (ms > -864e5){ box.classList.add("today"); box.textContent = t("countdownToday"); return; }
    else { box.hidden = true; return; }
    setTimeout(tick, 1000 - (Date.now() % 1000));
  })();
}

/* ---------- cánh hoa rơi ---------- */
function setupPetals(){
  const box = $("#petals"), r = rng(3), n = window.innerWidth < 640 ? 6 : 14;
  for (let i=0;i<n;i++){
    const s = document.createElement("span"), k = .6 + r()*.7;
    s.style.left = (r()*100)+"vw"; s.style.animationDuration = (14+r()*12)+"s"; s.style.animationDelay = (-r()*20)+"s";
    s.style.width = (14*k)+"px"; s.style.height = (11*k)+"px"; s.style.opacity = (.35+r()*.45).toFixed(2);
    box.appendChild(s);
  }
}

/* ---------- PIN ---------- */
function showGate(msg){ $("#pinErr").textContent = msg || ""; openModal("#gate"); setTimeout(()=>$("#pin").focus(),60); }
async function tryPin(){
  const v = $("#pin").value.trim(); if (!v) return;
  const btn = $("#pinBtn"); btn.disabled = true; btn.textContent = t("gateChecking"); PIN = v;
  try{
    const res = await api("verify");
    if (!res.ok){ $("#pinErr").textContent = res.code==="BAD_PIN" ? t("pinWrong") : (res.error || t("pinWrong")); PIN=""; return; }
    save("cta_pin", v); $("#gate").classList.remove("show"); start();
  }catch(e){ $("#pinErr").textContent = t("netError"); PIN=""; }
  finally{ btn.disabled=false; btn.textContent=t("gateButton"); }
}
$("#pinBtn").onclick = tryPin;
$("#pin").addEventListener("keydown", e=>{ if (e.key==="Enter") tryPin(); });

let started = false, poll = null;
function start(){
  if (started) return; started = true;
  spotAfter = Date.now() + 10000;
  refresh(false);
  clearInterval(poll); poll = setInterval(()=>{ if (!document.hidden) refresh(true); }, TIMING.refresh*1000);
}

/* ---------- khởi động ---------- */
if (PREVIEW) document.body.classList.add("preview");
applyTexts(); buildLeafGradients(); buildGrass(); buildLegend(); syncType(); setupCountdown(); setupPetals();
drawTree(STAGES[0]); currentStage = STAGES[0]; renderLeaves();
if (PIN) start(); else showGate();
</script>
