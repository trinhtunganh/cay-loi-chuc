  BC.forEach((c,i)=>{
    const g = el("g"), wing = el("g");
    wing.appendChild(el("path",{d:"M-5,-3 C-4,-17 5,-19 8,-4 Z", fill:c[2]}));
    g.append(
      el("path",{d:"M-10,-1 L-20,-6 L-17,0 L-20,5 Z", fill:c[2]}),
      el("ellipse",{cx:"0", cy:"0", rx:"11", ry:"6.5", fill:c[0]}),
      el("ellipse",{cx:"1.5", cy:"2.4", rx:"7.5", ry:"3.6", fill:c[1]}),
      el("circle",{cx:"10", cy:"-3.5", r:"5.2", fill:c[0]}),
      el("circle",{cx:"11.8", cy:"-4.6", r:"1.3", fill:"#1A1A1A"}),
      el("circle",{cx:"12.2", cy:"-5", r:".45", fill:"#fff"}),
      el("path",{d:"M14.6,-4.5 L20,-2.6 L14.6,-1 Z", fill:"#F2A93B"}),
      wing);
    $("#birdsG").appendChild(g);
    BIRDS.push({g, wing, speed:.04+i*.011, off:i*.41, alt:.1+i*.075, size:1-i*.12, flap:i*1.7});
  });
  const cols = [["#FF6F8C","#E4002B"],["#FFC94D","#E8743B"],["#7FB7FF","#3D6FB6"]];
  cols.forEach((c,i)=>{
    const g = el("g"), wl = el("g"), wr = el("g");
    wl.append(el("ellipse",{cx:"-5", cy:"-3", rx:"6", ry:"4.5", fill:c[0]}), el("ellipse",{cx:"-4", cy:"3", rx:"4", ry:"3", fill:c[1]}));
    wr.append(el("ellipse",{cx:"5", cy:"-3", rx:"6", ry:"4.5", fill:c[0]}), el("ellipse",{cx:"4", cy:"3", rx:"4", ry:"3", fill:c[1]}));
    g.append(wl, wr, el("rect",{x:"-1", y:"-6", width:"2", height:"12", rx:"1", fill:"#3D3D3D"}));
    $("#flyG").appendChild(g);
    FLIES.push({g, wl, wr, a:.6+i*.25, b:.9+i*.3, ph:i*2.1});
  });
}
function updateFlyers(now){
  const k = CAM.h/980;
  BIRDS.forEach(b=>{
    const t = ((now/1000)*b.speed + b.off) % 1.25;
    const x = VIS.x - 60*k + t*(VIS.w + 120*k), y = CAM.y + CAM.h*b.alt + Math.sin(t*12)*8*k;
    const f = Math.sin(now/110 + b.flap), sc = 1.45*b.size*k;
    b.g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(-Math.cos(t*12)*6).toFixed(1)}) scale(${sc.toFixed(3)})`);
    b.wing.setAttribute("transform", `translate(0,-3) scale(1,${(f*.85+.15).toFixed(2)}) translate(0,3)`);
  });
  const cy = TREE.top + (BASE.y - TREE.top)*.36, rx = Math.max(110, (BASE.y-TREE.top)*.55), ry = (BASE.y - TREE.top)*.25;
  FLIES.forEach(f=>{
    const t = now/1000;
    const x = BASE.x + Math.sin(t*f.a*.5 + f.ph)*rx, y = cy + Math.sin(t*f.b*.5 + f.ph*1.3)*ry + Math.sin(t*3+f.ph)*6;
    const flap = .25 + Math.abs(Math.sin(t*14 + f.ph))*.75;
    f.g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(Math.cos(t*f.a*.5+f.ph)*25).toFixed(0)}) scale(${(k*1.1).toFixed(3)})`);
    f.wl.setAttribute("transform", `scale(${flap.toFixed(2)},1)`); f.wr.setAttribute("transform", `scale(${flap.toFixed(2)},1)`);
  });
}

let lastT = 0, frameN = 0;
function animate(now){
  if (frameN++ % 30 === 0) updateVis();
  const dt = Math.min(.05, lastT ? (now-lastT)/1000 : 0); lastT = now;
  BOTS.forEach(b=>updateBot(b, dt, now));
  updateFlyers(now);
  if (!REDUCED) requestAnimationFrame(animate);
}
function setupScene(){ buildSun(); buildBots(); buildFlyers(); placeSun(); requestAnimationFrame(animate); }

/* giai đoạn: tên và mốc lấy từ config, độ lớn tính tự động */
const STAGES = (function(){
  const src = (CFG.stages && CFG.stages.length) ? CFG.stages.slice().sort((a,b)=>a.min-b.min) : [{min:0,name:""}];
  const n = src.length;
  return src.map((s,i)=>({ min:s.min, name:s.name,
    depth: n===1 ? MAXD : Math.max(1, Math.round(1 + i*(MAXD-1)/(n-1))),
    scale: n===1 ? 1 : .42 + i*(.58/(n-1)) }));
})();
const stageIdx = n => STAGES.reduce((k,x,i)=> n>=x.min ? i : k, 0);

let items = [], byId = new Map(), currentStage = null, leafEls = new Map(), loaded = false;

function buildLeafGradients(){ PALETTE.forEach(leafGrad); DEPARTMENTS.forEach(d=>leafGrad(deptColor(d))); }
function buildGrass(){
  const g = $("#grass"), r = rng(5);
  for (let i=0;i<46;i++){
    const x = 180 + r()*640, y = 930 + r()*40, k = .6 + r()*.6, col = r()<.5 ? "#7FAE62" : "#6E9F55";
    [-1,0,1].forEach(j=>{ const h=(6+r()*6)*k, lean=j*3*k+(r()-.5)*2;
      g.appendChild(el("path",{d:`M${(x+j*1.5).toFixed(1)},${y.toFixed(1)} q${(lean*.3).toFixed(1)},${(-h*.6).toFixed(1)} ${lean.toFixed(1)},${(-h).toFixed(1)}`, stroke:col, "stroke-width":"1.2", fill:"none", "stroke-linecap":"round", opacity:".7"})); });
  }
}
function segPath(s){
  /* pháp tuyến tính theo tiếp tuyến tại từng điểm để cành cong vẫn thuôn đều */
  const nrm = (dx,dy)=>{ const l=Math.hypot(dx,dy)||1; return [-dy/l, dx/l]; };
  const n1 = nrm(s.cx-s.x1, s.cy-s.y1), n2 = nrm(s.x2-s.cx, s.y2-s.cy), nm = nrm(s.x2-s.x1, s.y2-s.y1);
  const h1 = s.w/2, h2 = s.w2/2, hm = (h1+h2)/2;
  const p = (x,y,n,k)=>`${(x+n[0]*k).toFixed(1)},${(y+n[1]*k).toFixed(1)}`;
  return `M${p(s.x1,s.y1,n1,h1)} Q${p(s.cx,s.cy,nm,hm)} ${p(s.x2,s.y2,n2,h2)} L${p(s.x2,s.y2,n2,-h2)} Q${p(s.cx,s.cy,nm,-hm)} ${p(s.x1,s.y1,n1,-h1)} Z`;
}
function drawTree(stage){
  const g = $("#branches"); g.textContent = "";
  g.appendChild(el("path",{d:`M${BASE.x-48},${BASE.y+6} C${BASE.x-30},${BASE.y-6} ${BASE.x-22},${BASE.y-30} ${BASE.x-21},${BASE.y-60} L${BASE.x+21},${BASE.y-60} C${BASE.x+22},${BASE.y-30} ${BASE.x+30},${BASE.y-6} ${BASE.x+52},${BASE.y+6} Z`, fill:"url(#bark)"}));
  SEGS.filter(s=>s.depth<=stage.depth).sort((a,b)=>a.depth-b.depth).forEach(s=>{
    const p = el("path",{d:segPath(s), fill:"url(#bark)", class:"seg-in"});
    p.style.animationDelay = (s.depth*.07)+"s";
    g.appendChild(p);
    if (s.depth < stage.depth) g.appendChild(el("circle",{cx:s.x2.toFixed(1), cy:s.y2.toFixed(1), r:(s.w2/2).toFixed(1), fill:"#6E4630"}));
  });
  const sc = stage.scale;
  $("#treeScale").setAttribute("transform",`translate(${BASE.x*(1-sc)},${BASE.y*(1-sc)}) scale(${sc})`);
  const top = Math.min(...SEGS.filter(s=>s.depth<=stage.depth).map(s=>BASE.y*(1-sc)+s.y2*sc));
  const h = Math.min(980, Math.max(560, 980 - (top - 120)));
  const w = h*1000/980;
  CAM = {x:500-w/2, y:980-h, w, h}; TREE = {top, sc};
  $("#tree").setAttribute("viewBox", `${CAM.x.toFixed(0)} ${CAM.y.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}`);
  updateVis();
  if ($("#sunG").firstChild) placeSun();
}
function leafShape(m, size, r){
  const g = el("g",{class:"shape"});
  if (m.toType==="company"){
    const s = size*.62;
    for (let i=0;i<5;i++){
      g.appendChild(el("path",{d:`M0,0 C${-s*.55},${-s*.25} ${-s*.6},${-s*.95} 0,${-s*1.05} C${s*.6},${-s*.95} ${s*.55},${-s*.25} 0,0 Z`, fill:"url(#petal)", transform:`rotate(${i*72 + r()*8})`, stroke:"rgba(160,0,30,.18)", "stroke-width":".6"}));
    }
    g.appendChild(el("circle",{r:(s*.26).toFixed(1), fill:"#FFD36B"}));
    for (let i=0;i<6;i++){ const a=i*60*Math.PI/180; g.appendChild(el("circle",{cx:(Math.cos(a)*s*.2).toFixed(1), cy:(Math.sin(a)*s*.2).toFixed(1), r:(s*.06).toFixed(1), fill:"#B8741A"})); }
  } else {
    const s = size, c = deptColor(m.toDept), bulge = .36 + r()*.12;
    g.appendChild(el("path",{d:`M0,0 C${s*.25},${-s*bulge} ${s*.8},${-s*bulge*1.05} ${s*1.25},0 C${s*.8},${s*bulge*1.05} ${s*.25},${s*bulge} 0,0 Z`, fill:leafGrad(c), stroke:shade(c,-.35), "stroke-width":".7", "stroke-opacity":".5"}));
    g.appendChild(el("path",{d:`M${s*.04},0 Q${s*.6},${-s*.04} ${s*1.12},0`, stroke:"rgba(255,255,255,.6)", "stroke-width":"1.1", fill:"none"}));
    for (let i=1;i<=3;i++){ const x=s*(.25*i); g.appendChild(el("path",{d:`M${x},0 l${s*.12},${-s*.13} M${x},0 l${s*.12},${s*.13}`, stroke:"rgba(255,255,255,.35)", "stroke-width":".8", fill:"none"})); }
  }
  return g;
}
function placeLeaf(m, stage, cands){
  const h = hash(m.id), r = rng(h);
  const s = cands[h % cands.length];
  const tt = .25 + r()*.75, u = 1-tt;
  const x = u*u*s.x1 + 2*u*tt*s.cx + tt*tt*s.x2, y = u*u*s.y1 + 2*u*tt*s.cy + tt*tt*s.y2;
  const side = r()<.5 ? -1 : 1, off = ((s.w+s.w2)/4 + 1 + r()*12) * side;
  const px = x + -Math.sin(s.ang)*off, py = y + Math.cos(s.ang)*off;
  const rot = (s.ang*180/Math.PI) + side*(30+r()*50);
  const size = (m.toType==="company" ? 22 : 21) / stage.scale;
  return {x:px, y:py, rot, size, r};
}

/* đặt thẻ lời chúc ra khoảng trống xa tán cây, nối với chiếc lá bằng một đường mảnh */
function placeCallout(le, scroll){
  const c = $("#card"), main = $(".main"), ld = $("#leader");
  if (!le){ c.classList.remove("show"); ld.classList.remove("show"); return; }
  let r = le.getBoundingClientRect();
  if (scroll && (r.top < 80 || r.bottom > innerHeight - 40)){ le.scrollIntoView({block:"center"}); r = le.getBoundingClientRect(); }
  const mr = main.getBoundingClientRect(), st = $(".stage").getBoundingClientRect(), cv = $("#treeScale").getBoundingClientRect();
  const feedEl = $("#feed"), wideFeed = getComputedStyle(feedEl).position === "absolute";
  const rightEdge = wideFeed ? feedEl.getBoundingClientRect().left - 28 : Math.min(innerWidth, st.right) - 16;
  const room = rightEdge - cv.right - 24, side = room >= 300;
  c.style.width = side ? Math.min(400, room).toFixed(0) + "px" : "";
  const w = c.offsetWidth, h = c.offsetHeight;
  const lx = r.left + r.width/2, ly = r.top + r.height/2;
  let L, T, ex, ey, d;
  if (side){
    /* màn rộng: khung nằm ở khoảng trời bên phải */
    L = rightEdge - w;
    T = Math.max(st.top + 40, 16); T = Math.min(T, innerHeight - h - 16);
    ex = L; ey = T + h*0.7;
    d = `M${lx},${ly} C${lx+130},${ly} ${ex-150},${ey} ${ex},${ey}`;
  } else {
    /* màn hẹp: khung nằm dưới chân cây, đè lên cỏ */
    L = Math.max(12, (innerWidth - w)/2);
    T = Math.min(st.bottom, innerHeight) - h - 10; T = Math.max(T, ly + 40);
    ex = L + w/2; ey = T;
    d = `M${lx},${ly} C${lx},${ly+80} ${ex},${ey-80} ${ex},${ey}`;
  }
  c.style.left = (L - mr.left).toFixed(0) + "px";
  c.style.top = (T - mr.top).toFixed(0) + "px";
  const acc = getComputedStyle(c).getPropertyValue("--accent").trim() || BRAND;
  ld.style.left = (-mr.left) + "px"; ld.style.top = (-mr.top) + "px";
  const path = ld.querySelector("path"); path.setAttribute("d", d); path.setAttribute("stroke", acc);
  ld.querySelector(".ring").setAttribute("stroke", acc);
  [[".ring",lx,ly],[".dot",lx,ly],[".end",ex,ey]].forEach(([q,x,y])=>{ const e = ld.querySelector(q); e.setAttribute("cx",x.toFixed(1)); e.setAttribute("cy",y.toFixed(1)); if (q!==".ring") e.setAttribute("fill",acc); });
  ld.style.setProperty("--len", Math.ceil(path.getTotalLength()) + "px");
  ld.classList.remove("show"); void ld.getBoundingClientRect();
  requestAnimationFrame(()=>{ c.classList.add("show"); ld.classList.add("show"); });
}

  const q = norm($("#q").value);

    return norm(m.toName).includes(q) || norm(m.toDept).includes(q) || norm(m.text).includes(q) || (m.toType==="company" && norm(COMPANY).includes(q));

function highlight(text, q){
  const safe = esc(text); if (!q) return safe;
  const n = norm(text), i = n.indexOf(q);
  if (i < 0 || n.length !== text.length) return safe;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
/* cuộn vô hạn: hiện 30 lời chúc, cuộn gần cuối thì nạp tiếp */
const FEED_PAGE = 30;
let feedSrc = [], feedShown = 0, feedFresh = new Set(), feedQ = "", feedFiltered = null, feedObs = null;
function feedItem(m){
  const li = document.createElement("li"); if (feedFresh.has(m.id)) li.className = "new";
  const to = document.createElement("div"); to.className="f-to"; to.style.color = shade(colorOf(m),-.15);
  to.innerHTML = miniIcon(m); to.appendChild(document.createTextNode(recipient(m)));
  if (m.featured) to.insertAdjacentHTML("beforeend", `<span class="feat">★ ${esc(t("featuredBadge"))}</span>`);
  const tx = document.createElement("div"); tx.className="f-text"; tx.innerHTML = highlight(m.text, feedQ);
  const tm = document.createElement("div"); tm.className="f-time"; tm.textContent = (!ANON && m.from ? t("feedFrom",{from:m.from}) + " · " : "") + timeAgo(m.time);
  li.append(to, tx, tm); li.onclick = ()=>showCard(m,"open", feedFiltered || items);
  return li;
}
function feedMore(n){
  const ul = $("#feedList"), sentinel = $("#feedMore"), end = Math.min(feedSrc.length, feedShown + (n||FEED_PAGE));
  const frag = document.createDocumentFragment();
  for (let i=feedShown; i<end; i++) frag.appendChild(feedItem(feedSrc[i]));
  ul.insertBefore(frag, sentinel); feedShown = end;
  sentinel.hidden = feedShown >= feedSrc.length;
}
function renderFeed(fresh, keep=false){
  fresh = fresh || new Set();
  const ul = $("#feedList"), top = ul.scrollTop, had = feedShown;
  feedFiltered = filtered(); feedQ = norm($("#q").value); feedFresh = fresh || new Set();
  $("#feedTitle").textContent = feedFiltered ? t("feedResults") : t("feedTitle");
  $("#feedLive").hidden = !!feedFiltered;
  feedSrc = (feedFiltered || items).slice().sort((a,b)=>String(b.time).localeCompare(String(a.time)));
  ul.textContent = ""; feedShown = 0;
  const sentinel = document.createElement("li"); sentinel.id = "feedMore"; sentinel.className = "f-more"; sentinel.textContent = t("feedLoading") || "…";
  ul.appendChild(sentinel);
  if (!feedSrc.length){ sentinel.hidden = true; const li=document.createElement("li"); li.className="f-empty"; li.textContent = feedFiltered ? t("feedNoMatch") : t("feedEmpty"); ul.insertBefore(li, sentinel); return; }
  feedMore(keep ? Math.max(FEED_PAGE, had + fresh.size) : FEED_PAGE);
  ul.scrollTop = keep ? top : 0;
  if (!feedObs && "IntersectionObserver" in window){
    feedObs = new IntersectionObserver(es=>{ if (es.some(e=>e.isIntersecting)) feedMore(); }, {root: ul, rootMargin:"0px 0px 300px 0px"});
  }
  if (feedObs){ feedObs.disconnect(); feedObs.observe(sentinel); }
}

/* ---------- tải dữ liệu ---------- */
const mine = new Map();
/* đồng bộ tiết kiệm: nhớ phiên bản danh sách máy chủ đã gửi để lần sau chỉ nhận phần thay đổi */
let srvItems = [], syncVer = "", syncAfter = "";
function resetSync(){ srvItems = []; syncVer = ""; syncAfter = ""; }
async function refresh(silent){
  refresh.at = Date.now();
  try{
    const res = await api("list", syncVer && loaded ? {since:syncVer, after:syncAfter} : {});
    if (res.ok && followActive(res)) return refresh(silent);
    if (!res.ok && /bận/.test(res.error||"")) throw new Error(res.error);
    if (!res.ok){ if (res.code==="BAD_PIN"){ save("cta_pin"); PIN=""; started=false; showGate(t("pinChanged")); } return; }
    if (Array.isArray(res.depts)) applyDepts(res.depts);
    let base;
    if (res.same && loaded) base = srvItems;
    else if (res.partial && loaded) base = srvItems.concat(res.items || []);
    else base = res.items || [];
    srvItems = base; syncVer = res.ver || "";
    syncAfter = base.reduce((a,m)=> String(m.time) > a ? String(m.time) : a, "");
    /* không có gì mới và không có lời chúc riêng đang chờ: khỏi vẽ lại cây */
    if (res.same && loaded && !mine.size){ refresh.fails = 0; return; }
    const incoming = base.slice(), fresh = new Set(), first = !loaded;
    const have = new Set(incoming.map(m=>m.id));
    mine.forEach((m,id)=>{ if (have.has(id) || Date.now() - new Date(m.time) > 180000) mine.delete(id); else incoming.push(m); });
    if (!first) incoming.forEach(m=>{ if (!byId.has(m.id)) fresh.add(m.id); });
    items = incoming.sort((a,b)=> String(a.time).localeCompare(String(b.time)));
    byId = new Map(items.map(m=>[m.id,m]));
    loaded = true;
    renderLeaves(fresh); updateLegend();
    if (first) maybeShowHint();
    if (fresh.size){
      const last = items.find(m=>fresh.has(m.id));
      const ul = $("#feedList"), feedSide = getComputedStyle($("#feed")).position === "absolute";
      if (ul.scrollTop > 40){ const pill = $("#feedNew"); pill.textContent = t("feedNewPill",{n:fresh.size}); pill.hidden = false; }
      if (!feedSide) toast(fresh.size===1 ? t("toastNewOne",{to:target(last)}) : t("toastNewMany",{n:fresh.size}));
    }
    refresh.fails = 0;
  }catch(e){
    /* máy chủ bận hoặc mạng chập chờn: tự thử lại sau vài giây, giãn dần, lệch nhau giữa các máy */
    refresh.fails = (refresh.fails||0) + 1;
    /* máy chủ đang dùng lỗi liên tục: thử máy chủ còn lại */
    const other = otherBackend();
    if (refresh.fails >= 3 && other){
      try{
        const r2 = await api("verify", {}, other);
        if (r2 && r2.ok){ markFailover(CUR); useBackend(other); refresh.fails = 0; return refresh(silent); }
      }catch(e2){}
    }
    if (!silent && refresh.fails > 2) toast(t("loadError"));
    if (refresh.fails <= 5){ clearTimeout(refresh.retry); refresh.retry = setTimeout(()=>refresh(true), (3 + Math.random()*5) * 1000 * refresh.fails); }
  }
}

function setupCountdown(){
  const when = new Date(EVT.birthday), box = $("#countdownBox");
  if (isNaN(when)) { box.hidden = true; return; }
  const dateStr = when.toLocaleDateString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit",year:"numeric"});
  $("#countdownLbl").textContent = t("countdownAfter",{date:dateStr});
  $("#countdownLbl").hidden = !t("countdownAfter");
  const pad = n => String(n).padStart(2,"0");
  (function tick(){
    const ms = when - Date.now();
    if (ms > 0){
      const s = Math.floor(ms/1000);
      $("#cdD").textContent = Math.floor(s/86400); $("#cdH").textContent = pad(Math.floor(s%86400/3600));
      $("#cdM").textContent = pad(Math.floor(s%3600/60)); $("#cdS").textContent = pad(s%60);
    } else if (ms > -864e5){ box.classList.add("today"); box.textContent = t("countdownToday"); return; }
    else { box.hidden = true; return; }
    setTimeout(tick, 1000 - (Date.now() % 1000));
  })();
}

function exportCsv(){
  const cell = v => { const s = String(v == null ? "" : v); return /[",\n\r;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const fmt = ts => { const d = new Date(ts); return isNaN(d) || !ts ? "" : d.toLocaleString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh"}); };
  const type = m => m.toType==="company" ? t("optCompany") : m.toType==="dept" ? t("optDept") : t("optPerson");
  const head = ["Mã","Thời gian","Account VGR","Gửi tới","Phòng ban","Tên người nhận","Nội dung","Trạng thái","Tiêu biểu","Giải thưởng","Thời điểm trúng"];

    m.id, fmt(m.time), m.account||"", type(m), m.toDept||"", m.toName||"", m.text||"", statusOf(m), m.featured ? "Có" : "", m.prize||"", m.wonAt ? fmt(m.wonAt) : ""
  ]);
  const csv = "\ufeff" + [head].concat(rows).map(r=>r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `cay-tri-an-loi-chuc-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(t("adminExported",{n:rows.length}));
}

/* ---- quay thưởng: chỉ quản trị; ai đã trúng thì không còn trong danh sách ---- */
const pad2 = n => String(n).padStart(2,"0");
const toLocalInput = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
let dwBusy = false, dwLast = null, dwShowingWin = false;
function dwSetRange(kind){
  const now = new Date(), to = new Date(now.getTime() + 60e3);
  let from;
  if (kind==="1h") from = new Date(now.getTime() - 3600e3);
  else if (kind==="today"){ from = new Date(now); from.setHours(0,0,0,0); }
  else if (kind==="7d") from = new Date(now.getTime() - 7*864e5);
  else { const first = adminItems.reduce((a,m)=>Math.min(a, Date.parse(m.time)||a), now.getTime()); from = new Date(first - 60e3); }
  $("#dwFrom").value = toLocalInput(from); $("#dwTo").value = toLocalInput(to); dwInfo();
}
function dwWinnersSet(){ return new Set(adminItems.filter(m=>m.prize && m.account).map(m=>m.account.toLowerCase())); }
function dwPool(){
  const from = Date.parse($("#dwFrom").value), to = Date.parse($("#dwTo").value), onlyOk = $("#dwApproved").checked, won = dwWinnersSet();
  return adminItems.filter(m=>{
    const tm = Date.parse(m.time);
    return !m.deleted && m.account && !won.has(m.account.toLowerCase()) && (!onlyOk || m.approved) && (isNaN(from) || tm >= from) && (isNaN(to) || tm <= to);
  });
}
function dwInfo(){
  const pool = dwPool(), people = new Set(pool.map(m=>m.account.toLowerCase()));
  /* giải thích vì sao lời chúc không vào danh sách quay */
  const from = Date.parse($("#dwFrom").value), to = Date.parse($("#dwTo").value), onlyOk = $("#dwApproved").checked;
  const inRange = adminItems.filter(m=>{ const tm = Date.parse(m.time); return !m.deleted && (isNaN(from) || tm >= from) && (isNaN(to) || tm <= to); });
  const noAcc = inRange.filter(m=>!m.account).length, notOk = onlyOk ? inRange.filter(m=>m.account && !m.approved).length : 0;
  let html = esc(t("drawInfo",{n:pool.length, p:people.size, w:dwWinnersSet().size})).replace(/(\d+)/g,"<b>$1</b>");
  const why = [];
  if (noAcc) why.push(t("drawNoAcc",{n:noAcc}));
  if (notOk) why.push(t("drawNotApproved",{n:notOk}));
  if (!inRange.length) why.push(t("drawNoneInRange"));
  if (ANON) why.unshift(t("drawAnonWarn"));
  if (why.length) html += `<br><span class="dw-why">${esc(why.join(" "))}</span>`;
  $("#dwInfo").innerHTML = html;
  $("#dwSpin").disabled = dwBusy || !pool.length;
  if (!dwBusy && !dwShowingWin) dwRenderCloud(pool);
  dwRenderTable(inRange, pool);
}
/* bảng kê lời chúc trong khoảng thời gian đã chọn, kèm lý do nếu không được quay */
function dwRenderTable(inRange, pool){
  const ok = new Set(pool.map(m=>m.id)), won = dwWinnersSet(), body = $("#dwTbl");
  const list = inRange.slice().sort((a,b)=>String(b.time).localeCompare(String(a.time)));
  $("#dwListH").textContent = t("drawListTitle",{n:list.length, k:pool.length});
  const fmt = ts => { const d = new Date(ts); return isNaN(d) ? "" : d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };
  const status = m => ok.has(m.id) ? ["ok", t("drawStOk")] : m.prize ? ["won", "🎁 " + m.prize] : !m.account ? ["", t("drawStNoAcc")]
    : won.has(m.account.toLowerCase()) ? ["won", t("drawStWon")] : !m.approved ? ["", t("drawStPending")] : ["", "—"];
  if (!list.length){ body.innerHTML = `<tr><td colspan="6" class="a-empty">${esc(t("drawNoneInRange"))}</td></tr>`; return; }
  body.innerHTML = list.slice(0, 600).map((m,i)=>{ const [c, s] = status(m);
    return `<tr class="${c==="ok"?"":"no"}"><td>${i+1}</td><td class="nw">${esc(fmt(m.time))}</td><td class="nw"><b>${esc(m.account||"—")}</b></td><td class="nw">${esc(recipient(m))}</td><td class="tx">${esc(m.text)}</td><td><span class="st ${c}">${esc(s)}</span></td></tr>`; }).join("");
}
/* "đám mây" account: mỗi người một ô, chữ tự co cho vừa khung đỏ */
function dwAccounts(pool){
  const seen = new Map();
  pool.forEach(m=>{ const k = m.account.toLowerCase(); if (!seen.has(k)) seen.set(k, m.account); });
  return [...seen.entries()];
}
function dwRenderCloud(pool){
  const box = $("#dwCloud"), stage = $("#dwStage"), accs = dwAccounts(pool);
  stage.classList.remove("done","rolling"); $("#dwResult").hidden = true; box.textContent = ""; dwProgReset();
  if (!accs.length){ box.innerHTML = '<span class="dw-empty">?</span>'; box.style.fontSize = ""; return; }
  const n = accs.length;
  box.style.fontSize = (n <= 12 ? 22 : n <= 30 ? 18 : n <= 70 ? 15 : n <= 140 ? 12 : 10.5) + "px";
  const frag = document.createDocumentFragment(), chips = [];
  accs.forEach(([k, name])=>{ const s = document.createElement("span"); s.className = "dw-chip"; s.dataset.k = k; s.textContent = name; frag.appendChild(s); chips.push(s); });
  box.appendChild(frag);
  /* rải ngẫu nhiên: mỗi ô thử nhiều vị trí, lấy chỗ ít chồng lên ô khác nhất */
  const W = box.clientWidth, H = box.clientHeight, placed = [], gap = 4;
  chips.forEach(c=>{
    const w = c.offsetWidth, h = c.offsetHeight;
    let best = null, bestOv = Infinity;
    for (let k = 0; k < 70 && bestOv > 0; k++){
      const x = Math.random() * Math.max(0, W - w), y = Math.random() * Math.max(0, H - h);
      let ov = 0;
      for (const p of placed){
        const ox = Math.min(x + w + gap, p.x + p.w) - Math.max(x, p.x - gap), oy = Math.min(y + h + gap, p.y + p.h) - Math.max(y, p.y - gap);
        if (ox > 0 && oy > 0) ov += ox * oy;
      }
      if (ov < bestOv){ bestOv = ov; best = {x, y}; }
    }
    c.style.left = best.x + "px"; c.style.top = best.y + "px";
    placed.push({x:best.x, y:best.y, w, h});
  });
}
function dwProgReset(){ const p = $("#dwProg"); p.style.transition = "none"; p.style.width = "0"; }
function dwProgRun(ms){ const p = $("#dwProg"); dwProgReset(); void p.offsetWidth; p.style.transition = `width ${ms}ms linear`; p.style.width = "100%"; }
const DW_SPIN_MS = 5000;
function dwChipFor(acc){ return [...$$("#dwCloud .dw-chip")].find(c=>c.dataset.k === String(acc).toLowerCase()); }
function dwCenterWin(chip){
  const box = $("#dwCloud"), W = box.clientWidth, H = box.clientHeight, w = chip.offsetWidth, h = chip.offsetHeight;
  const s = Math.max(1, Math.min(4, (W * .8) / w, (H * .45) / h));
  const dx = W/2 - (chip.offsetLeft + w/2), dy = H/2 - (chip.offsetTop + h/2);
  chip.style.transform = `translate(${dx}px,${dy}px) scale(${s})`;
}
function dwRenderWinners(){
  const ul = $("#dwWinners"); ul.textContent = "";
  const list = adminItems.filter(m=>m.prize).sort((a,b)=>(b.wonAt||0)-(a.wonAt||0));
  if (!list.length){ ul.innerHTML = `<li class="a-empty">${esc(t("drawNoWinners"))}</li>`; return; }
  list.forEach(m=>{
    const li = document.createElement("li");
    li.innerHTML = `<span class="pz">🎁 ${esc(m.prize)}</span><span><span class="ac">${esc(m.account)}</span> <small>· ${esc(recipient(m))} · ${esc(new Date(m.wonAt||Date.now()).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}))}</small></span><button type="button">${esc(t("drawRemove"))}</button>`;
    li.querySelector("button").onclick = ()=>dwSetPrize(m, "");
    ul.appendChild(li);
  });
}
async function dwSetPrize(m, prize){
  const res = await api("adminSet", {id:m.id, prize, wonAt:Date.now()});
  if (!res || !res.ok) throw new Error((res && res.error) || t("adminSaveError"));
  m.prize = res.prize != null ? res.prize : prize; m.wonAt = res.wonAt || (prize ? Date.now() : 0);
  dwRenderWinners(); dwInfo();
  return true;
}
function dwConfetti(){
  const box = $("#dwConfetti"), colors = ["#FFD15C","#ffffff","#FFC2CE","#7DE0A8","#8FC1FF"];
  for (let i=0;i<70;i++){ const e = document.createElement("i"); e.style.left = (Math.random()*100)+"%"; e.style.background = colors[i%colors.length];
    e.style.animationDelay = (Math.random()*.5)+"s"; e.style.animationDuration = (1.6+Math.random()*1.4)+"s"; box.appendChild(e); }
  setTimeout(()=>{ box.textContent = ""; }, 3600);
}
const rnd = n => { const a = new Uint32Array(1); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(a) : (a[0] = Math.floor(Math.random()*4294967296)); return a[0] % n; };
async function dwSpin(){
  const pool = dwPool(); if (!pool.length || dwBusy) return;
  const prize = $("#dwPrize").value.trim() || t("drawPrizeDefault");
  dwBusy = true; $("#dwSpin").disabled = true; $("#dwUndo").hidden = true;
  dwShowingWin = false; dwRenderCloud(pool);
  const stage = $("#dwStage"); stage.classList.add("rolling");
  $("#dwPrizeTag").textContent = prize; $("#dwTo2").textContent = ""; $("#dwText").textContent = "";
  const winner = pool[rnd(pool.length)];
  const chips = [...$$("#dwCloud .dw-chip")], t0 = performance.now(), dur = DW_SPIN_MS;
  dwProgRun(dur);
  let hot = null;
  await new Promise(done=>{
    (function tick(){
      const p = (performance.now() - t0) / dur;
      if (p >= 1) return done();
      if (hot) hot.classList.remove("hot");
      const from = chips;
      let next = from[rnd(from.length)];
      if (next === hot && from.length > 1) next = from[(from.indexOf(next) + 1) % from.length];
      hot = next; hot.classList.add("hot");
      setTimeout(tick, Math.min(55 + Math.pow(p, 2.4) * 460, Math.max(16, dur - (performance.now() - t0))));
    })();
  });
  if (hot) hot.classList.remove("hot");
  const wc = dwChipFor(winner.account);
  stage.classList.remove("rolling"); stage.classList.add("done");
  if (wc){ wc.classList.add("win"); dwCenterWin(wc); }
  dwShowingWin = true;
  $("#dwTo2").textContent = recipient(winner) + " · " + timeAgo(winner.time); $("#dwText").textContent = "“" + winner.text + "”"; $("#dwResult").hidden = false;
  dwConfetti();
  try{ await dwSetPrize(winner, prize); dwLast = winner; $("#dwUndo").hidden = false; }
  catch(e){ toast(e.message || t("adminSaveError")); }
  dwBusy = false; dwInfo();
}
async function openDraw(){
  if (!ADMIN_PIN) return openAdminGate();
  if (!dwBusy) dwShowingWin = false;
  if (!$("#dwPrize").value) $("#dwPrize").value = t("drawPrizeDefault");
  openModal("#drawPanel");
  $("#dwInfo").textContent = "…";
  try{ const r = await api("adminList"); if (r.ok) adminItems = (r.items||[]).sort((a,b)=>String(b.time).localeCompare(String(a.time))); }catch(e){}
  if (!$("#dwFrom").value) dwSetRange("all"); else dwInfo();
  dwRenderWinners();
}
$$("#drawPanel [data-pre]").forEach(b=>b.onclick = ()=>dwSetRange(b.dataset.pre));
["#dwFrom","#dwTo","#dwApproved"].forEach(q=>$(q).addEventListener("change", ()=>{ if (!dwBusy) dwShowingWin = false; dwInfo(); }));
$$("#drawPanel [data-pre]").forEach(b=>b.addEventListener("click", ()=>{ if (!dwBusy){ dwShowingWin = false; dwInfo(); } }));
$("#dwSpin").onclick = dwSpin;
$("#dwUndo").onclick = async ()=>{ if (!dwLast) return; try{ dwShowingWin = false; await dwSetPrize(dwLast, ""); $("#dwUndo").hidden = true; dwLast = null; toast(t("drawUndone")); }catch(e){ toast(e.message); } };
$("#btnDraw").onclick = openDraw;

function renderAdmin(){
  const isP = adminTab === "pin";
  $("#aPin").hidden = !isP;
  if (isP){
    ["#aDepts","#aList","#aSrv",".a-search","#aFilt","#aShow","#dpSave","#aAnon"].forEach(q=>$(q).hidden = true);
    $$("#aTabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===adminTab));
    $("#aInfo").textContent = "";
    pinLoad();
    return;
  }
  const isS = adminTab === "srv";
  $("#aSrv").hidden = !isS;
  if (isS){
    $("#aDepts").hidden = true; $("#aList").hidden = true; $(".a-search").hidden = true; $("#aFilt").hidden = true; $("#aShow").hidden = true; $("#dpSave").hidden = true; $("#aAnon").hidden = true;
    $$("#aTabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===adminTab));
    $("#aInfo").textContent = t("adminServerInfo",{name:BACKEND_NAMES[CUR]||""});
    $("#aCntAll").textContent = adminItems.filter(m=>!m.deleted).length;
    if (dpRows) $("#aCntDepts").textContent = dpRows.length;
    svRender(); svCheck().then(()=>{ if (adminTab==="srv") svRender(); });
    return;
  }
  const isD = adminTab === "depts";
  $("#aDepts").hidden = !isD; $("#aList").hidden = isD; $(".a-search").hidden = isD; $("#aFilt").hidden = isD; $("#aAnon").hidden = isD;
  $("#aShow").hidden = isD; $("#dpSave").hidden = !isD;
  if (!dpRows) dpInit();
  $("#aCntDepts").textContent = dpRows.length;
  if (isD){
    $$("#aTabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===adminTab));
    dpRender();
  }
  const live = adminItems.filter(m=>!m.deleted);
  const c = { all: live, pending: live.filter(m=>!m.approved), approved: live.filter(m=>m.approved), featured: live.filter(m=>m.featured), won: adminItems.filter(m=>m.prize), trash: adminItems.filter(m=>m.deleted) };
  $("#aCntAll").textContent = live.length;
  if (!isD) renderFilters(c);
  $$("#aTabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===adminTab));
  $("#aInfo").textContent = t("adminInfo",{n:c.featured.length});
  $("#aShow").disabled = !c.featured.length;
  if (isD) return dpFoot();
  const q = norm($("#aQ").value);
  const list = (c[adminFilter] || c.all).filter(m=>!q || norm(m.text).includes(q) || norm(m.toName).includes(q) || norm(m.toDept).includes(q) || norm(m.account).includes(q));
  const ul = $("#aList"); ul.textContent = "";
  if (!list.length){ ul.innerHTML = `<li class="a-empty">${esc(t("adminEmpty"))}</li>`; return; }
  list.forEach(m=>{
    const li = document.createElement("li"); if (m.featured) li.className = "is-feat";
    li.innerHTML = `<div class="a-meta">${miniIcon(m)}<b>${esc(recipient(m))}</b> · ${esc(timeAgo(m.time))}${m.account ? ` · <span class="a-acc">👤 ${esc(m.account)}</span>` : ""}${m.prize ? ` <span class="a-prize">🎁 ${esc(m.prize)}</span>` : ""}</div>
      <div class="a-text">${esc(m.text)}</div>
      <div class="a-acts">${m.deleted ? `<button class="rs">↺ ${esc(t("adminRestore"))}</button><button class="pg">✕ ${esc(t("adminPurge"))}</button>` :
        `<button class="ap ${m.approved?"on":""}">${m.approved?"✓ ":""}${esc(t("adminApprove"))}</button><button class="ft ${m.featured?"on":""}">${m.featured?"★":"☆"} ${esc(t("adminFeature"))}</button><button class="dl">🙈 ${esc(t("adminDelete"))}</button>`}</div>`;
    if (m.deleted){
      li.querySelector(".rs").onclick = ()=>adminSet(m, {deleted:false}, li);
      li.querySelector(".pg").onclick = e=>adminPurge(m, li, e.currentTarget);
    }
    else {
      li.querySelector(".ap").onclick = ()=>adminSet(m, {approved: !m.approved}, li);
      li.querySelector(".ft").onclick = ()=>adminSet(m, {featured: !m.featured}, li);
      li.querySelector(".dl").onclick = ()=>adminSet(m, {deleted:true}, li);
    }
    ul.appendChild(li);
  });
}
async function adminSet(m, change, li){
  li.querySelectorAll("button").forEach(b=>b.disabled = true);
  try{
    const res = await api("adminSet", Object.assign({id:m.id}, change));
    if (!res.ok) throw new Error();
    m.approved = res.approved; m.featured = res.featured; if (typeof res.deleted === "boolean") m.deleted = res.deleted;
    if (typeof res.prize === "string"){ m.prize = res.prize; m.wonAt = res.wonAt || 0; }
    renderAdmin(); refresh(true);
  }catch(e){ toast(t("adminSaveError")); li.querySelectorAll("button").forEach(b=>b.disabled = false); }
}
/* xóa hẳn khỏi cơ sở dữ liệu: bấm 2 lần để chắc chắn, chỉ với lời chúc đã "Ẩn đi" */
async function adminPurge(m, li, btn){
  if (!btn.classList.contains("arm")){
    btn.classList.add("arm"); btn.textContent = t("adminPurgeConfirm");
    clearTimeout(btn._t); btn._t = setTimeout(()=>{ btn.classList.remove("arm"); btn.textContent = "✕ " + t("adminPurge"); }, 4000);
    return;
  }
  clearTimeout(btn._t);
  li.querySelectorAll("button").forEach(b=>b.disabled = true);
  try{
    const res = await api("adminPurge", {id:m.id});
    if (!res || !res.ok) throw new Error(res && res.error === "Thao tác không hợp lệ." ? t("adminPurgeOld") : (res && res.error) || t("adminSaveError"));
    adminItems = adminItems.filter(x=>x.id !== m.id);
    renderAdmin(); toast(t("adminPurged"));
  }catch(e){ toast(e.message || t("adminSaveError")); li.querySelectorAll("button").forEach(b=>b.disabled = false); btn.classList.remove("arm"); btn.textContent = "✕ " + t("adminPurge"); }
}
$("#aAnonSw").onclick = async ()=>{
  const sw = $("#aAnonSw"), want = !ANON; sw.disabled = true;
  try{
    const res = await api("adminSetAnon", {anon: want});
    if (!res || !res.ok) throw new Error(res && res.error === "Thao tác không hợp lệ." ? t("adminAnonOld") : (res && res.error) || t("adminSaveError"));
    setAnonMode(res.anon);
    /* máy chủ còn lại: cập nhật luôn để khi tự chuyển máy chủ vẫn giống nhau (đồng bộ cũng sẽ làm việc này) */
    Object.keys(BACKENDS).filter(k=>k !== CUR).forEach(k=>{ apiRaw("adminSetAnon", {anon: want}, k).catch(()=>{}); });
    toast(t(res.anon ? "toastAnonOn" : "toastAnonOff"));
  }catch(e){ toast(e.message || t("adminSaveError")); }
  finally{ sw.disabled = false; }
};
$$("#aTabs button").forEach(b=>b.onclick = ()=>{ adminTab = b.dataset.tab; renderAdmin(); });
$("#aQ").addEventListener("input", renderAdmin);
$("#adminBtn").onclick = tryAdmin;
$("#adminPin").addEventListener("keydown", e=>{ if (e.key==="Enter") tryAdmin(); });
$("#gateAdmin").onclick = openAdminGate;
$("#btnAdmin").onclick = openAdmin;
$("#aLogout").onclick = ()=>{ ADMIN_PIN = ""; saveAdmin(""); $("#btnAdmin").hidden = true; $("#btnDraw").hidden = true; closeModals(); };
$("#aShow").onclick = ()=>{ refresh(true).then(()=>startShow("featured")); };
if (ADMIN_PIN){ $("#btnAdmin").hidden = false; $("#btnDraw").hidden = false; }

/* căn chân chữ "Chào mừng sinh nhật…" thẳng với chân chữ VINROBOTICS trong logo
   (chữ trong logo nằm từ 34% đến 81% chiều cao ảnh logo) */
function alignTitle(){
  const tt = $(".h-title"), logo = $("header .logo-img");
  if (!tt || !logo) return;
  tt.style.transform = "";
  const lr = logo.getBoundingClientRect(), tr = tt.getBoundingClientRect();
  if (!lr.height || tr.top > lr.bottom || tr.bottom < lr.top) return;   // tiêu đề nằm hàng khác (điện thoại)
  const probe = document.createElement("span"); probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
  tt.appendChild(probe); const baseline = probe.getBoundingClientRect().top; probe.remove();
  const target = lr.top + lr.height * (23.46 / 29);
  tt.style.transform = `translateY(${(target - baseline).toFixed(1)}px)`;
}
alignTitle();
addEventListener("resize", alignTitle);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignTitle);
$(".logo-img") && $("header .logo-img").addEventListener("load", alignTitle);
setTimeout(alignTitle, 1500);

if (PIN) start(); else showGate();
if (location.hash === "#admin") (ADMIN_PIN ? openAdmin : openAdminGate)();
</script>
