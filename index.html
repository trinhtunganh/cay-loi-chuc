<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cây Tri Ân · Mừng sinh nhật VinRobotics</title>
<meta name="description" content="Gửi lời cảm ơn, lời chúc giấu tên tới VinRobotics và đồng nghiệp. Mỗi lời chúc là một chiếc lá giúp Cây Tri Ân lớn lên.">
<meta name="theme-color" content="#E4002B">
<meta property="og:type" content="website">
<meta property="og:title" content="Cây Tri Ân · Mừng sinh nhật VinRobotics">
<meta property="og:description" content="Mỗi lời cảm ơn là một chiếc lá. Cùng vun cho Cây Tri Ân thật xanh trước ngày 21/11.">
<meta property="og:image" content="https://trinhtunganh.github.io/cay-loi-chuc/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://trinhtunganh.github.io/cay-loi-chuc/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --brand:#E4002B; --brand-dark:#B80023; --brand-soft:#FDE8EC; --brand-tint:#FFF5F6;
  --ink:#1A1A1A; --ink-2:#3D3D3D; --muted:#6B6B6B; --line:#ECE7E7;
  --card:#FFFFFF; --bg-top:#FFFBF9; --bg-mid:#FDF1F2; --bg-bot:#F4F6EE;
  --leaf:#2F7D57;
  --shadow-sm:0 2px 10px rgba(26,26,26,.06);
  --shadow:0 18px 48px rgba(122,20,40,.14), 0 2px 8px rgba(26,26,26,.06);
  --overlay:rgba(26,16,18,.5);
  --gutter:max(24px, calc((100vw - 1640px)/2 + 24px));
  --feed-w:0px;
  --tree-center:calc((100vw - var(--feed-w))/2);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font-family:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink); background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:3px solid rgba(228,0,43,.35);outline-offset:2px}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:11px 18px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:#d9cfd0;box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(228,0,43,.25)}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px;flex:0 0 auto}

/* Thanh xem trước */
.preview-bar{display:none;background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:7px 16px}
.preview-bar b{color:#ffb3c1;font-weight:500}
body.preview .preview-bar{display:block}

/* Header: dải đỏ thương hiệu */
header,.overview{position:relative;z-index:6}
header{display:grid;grid-template-columns:auto auto 1fr auto;gap:26px;align-items:center;padding:14px var(--gutter);margin-bottom:12px;background:linear-gradient(100deg,var(--brand) 0%,#C40026 100%);box-shadow:0 8px 24px rgba(228,0,43,.18);color:#fff}
.brand{--L:44px;display:flex;align-items:center;min-width:max-content}
#btnAdmin span{display:none} #btnAdmin{padding-left:14px;padding-right:14px}
.brand .logo-img{height:var(--L);width:auto;flex:0 0 auto}
header .logo-img{filter:brightness(0) invert(1)}
.h-title{border-left:1px solid rgba(255,255,255,.38);padding-left:24px;font-size:20px;font-weight:700;letter-spacing:.3px;line-height:1.2;min-width:0}
.hl{color:var(--brand)}
.actions{display:flex;gap:8px;justify-content:flex-end}
header .btn:not(.primary){background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.42)}
header .btn:not(.primary):hover{background:rgba(255,255,255,.22)}
header .btn.primary{background:#fff;color:var(--brand);box-shadow:0 6px 16px rgba(80,0,15,.18)}

/* Đếm ngược: bánh sinh nhật + 4 ô số */
.cd{justify-self:end;display:flex;align-items:center;gap:8px;color:#fff;font-size:14px}
.cd .cd-ico{font-size:40px;line-height:1;margin-right:2px;filter:drop-shadow(0 3px 6px rgba(80,0,15,.25))}
.cd .cd-before{font-size:14px;opacity:.92;margin-right:2px}
.cd-n{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:60px;padding:6px 4px 5px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.cd-n b{font-size:25px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.cd-n small{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;opacity:.88;margin-top:3px}
.cd-after{opacity:.9}
.cd.today{font-weight:700;font-size:18px}

/* Tổng quan: thẻ trạng thái + phòng ban */
.main{position:relative}
.overview{padding:12px var(--gutter) 0}
.status{display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:14px 24px;box-shadow:var(--shadow-sm)}
.st-count{display:flex;align-items:center;gap:12px;padding-right:22px;border-right:1px solid var(--line);flex:0 0 auto}
.st-count b{font-size:42px;line-height:1;font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums}
.st-count span{font-size:13px;color:var(--muted);line-height:1.3;max-width:96px}
.st-growth{flex:1;min-width:0}
.st-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.st-stage{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
.st-stage svg{width:18px;height:18px;flex:0 0 auto}
.st-next{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:9px;background:#f1e6e8;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7DB65A,var(--leaf));border-radius:9px;transition:width 1s}
.status.bump .st-count b{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.18)}}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;padding:5px 6px 5px 10px;font-size:13px;cursor:pointer;transition:all .2s}
.chip:hover{background:#fff;border-color:#d9cfd0}
.chip .mi{width:16px;height:16px;flex:0 0 auto}
.chip .n{min-width:22px;text-align:center;font-size:12px;font-weight:700;background:#F5EFEF;color:var(--ink-2);border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark);font-weight:500}
.chip.on .n{background:var(--brand);color:#fff}
.mi{display:inline-block;vertical-align:middle}

/* Sân khấu cây */
.stage{position:relative;width:100%}
#tree{width:100%;height:auto;display:block;max-height:calc(100vh - 300px);min-height:340px;overflow:visible}
body.preview #tree{max-height:calc(100vh - 330px)}
.leaf{cursor:pointer;outline:none}
.leaf .shape{transition:transform .25s,filter .25s,opacity .35s;transform-box:fill-box;transform-origin:0 50%}
.leaf.flower .shape{transform-origin:center}
.leaf:hover .shape,.leaf:focus-visible .shape{transform:scale(1.35);filter:drop-shadow(0 0 6px rgba(255,200,120,.95))}
.leaf.grow .shape{animation:grow 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.leaf.spot .shape{animation:pulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,190,90,1))}
@keyframes pulse{0%,100%{transform:scale(1.3)}50%{transform:scale(1.6)}}
.sway{animation:sway 7s ease-in-out infinite;transform-box:view-box;transform-origin:500px 930px}
@keyframes sway{0%,100%{transform:rotate(-.35deg)}50%{transform:rotate(.35deg)}}
svg.filtering .leaf:not(.match) .shape{opacity:.12}
svg.filtering .leaf.match .shape{filter:drop-shadow(0 0 8px rgba(255,190,90,1))}
.seg-in{animation:segin 1.1s ease-out both}
.deco{pointer-events:none}
.sun-rays{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes segin{from{opacity:0}to{opacity:1}}

/* Gợi ý chạm lá */
.tap-hint{position:absolute;left:var(--tree-center);top:10px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);transition:opacity .5s,transform .5s;white-space:nowrap}
.tap-hint.gone{opacity:0;transform:translate(-50%,-10px);pointer-events:none}
.tap-hint span{animation:tap 1.4s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(-3px)}}

/* Trạng thái trống */
.empty{position:absolute;left:var(--tree-center);top:42%;transform:translate(-50%,-50%);z-index:4;width:min(400px,calc(100vw - 40px));text-align:center;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;padding:24px 24px 22px;box-shadow:var(--shadow)}
.empty .e-ico{font-size:40px}
.empty h3{margin:6px 0 6px;font-size:19px}
.empty p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}

/* Cánh hoa rơi */
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.petals span{position:absolute;top:-30px;background:radial-gradient(circle at 30% 30%,#ffd1da,#ff6f8c 60%,#E4002B);border-radius:80% 10% 80% 10%;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-20px,0) rotate(0)}25%{transform:translate3d(30px,25vh,0) rotate(120deg)}50%{transform:translate3d(-20px,50vh,0) rotate(220deg)}75%{transform:translate3d(25px,75vh,0) rotate(300deg)}100%{transform:translate3d(-10px,105vh,0) rotate(400deg)}}

/* Thẻ lời chúc */
#card{position:absolute;left:0;top:0;width:min(380px,calc(100vw - 24px));background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(122,20,40,.2),0 2px 8px rgba(26,26,26,.08);padding:14px 16px 11px;border-top:4px solid var(--accent,var(--brand));z-index:30;opacity:0;pointer-events:none;transform:translateY(8px) scale(.97);transition:opacity .28s,transform .32s cubic-bezier(.2,1.2,.4,1)}
#card.show{opacity:1;pointer-events:auto;transform:none}
#leader{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:29;opacity:0;transition:opacity .3s}
#leader.show{opacity:1}
#leader path{fill:none;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
#leader.show path{animation:drawLine .5s ease-out forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
#card .q{position:absolute;right:44px;top:10px;width:30px;height:25px;color:var(--brand);opacity:.1;pointer-events:none}
#card .to{font-size:11.5px;font-weight:700;color:var(--accent,var(--brand));letter-spacing:.2px;text-transform:uppercase;padding-right:40px}
#card blockquote{margin:6px 0 8px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;max-height:30vh;overflow:auto;color:var(--ink-2)}
#card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);gap:8px}
#card .nav{display:flex;gap:6px}
#card .nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12px}
#card .nav button:hover{border-color:var(--brand);color:var(--brand)}
#card .close{position:absolute;top:6px;right:8px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);z-index:1;width:32px;height:32px;border-radius:50%}
#card .close:hover{background:var(--brand-tint)}
#card .peek-hint{display:none;color:var(--brand);font-weight:500}
#card.peek{cursor:pointer}
#card.peek .nav,#card.peek .close{display:none}
#card.peek .peek-hint{display:inline}

/* Danh sách lời chúc + tìm kiếm */
#feed{display:flex;flex-direction:column;margin:8px 16px 24px;z-index:7!important;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative;z-index:5}
.f-head{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.f-head h3{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--brand)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.f-filters{display:flex;flex-direction:column;gap:8px}
.f-head{position:relative}
.f-newpill{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);z-index:2;border:0;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer;box-shadow:0 6px 16px rgba(228,0,43,.3);animation:pop .3s}
.f-search{display:flex;align-items:center;gap:8px;border:1px solid #E2DCDC;border-radius:12px;padding:0 6px 0 12px;background:#fff;transition:border-color .2s,box-shadow .2s}
.f-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(228,0,43,.12)}
.f-search svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto}
.f-search input{border:0;outline:0;background:transparent;flex:1;min-width:0;padding:10px 0;font-size:15px}
.f-search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.f-search .clear{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;width:28px;height:28px;border-radius:50%}
.f-search .clear:hover{background:var(--brand-tint);color:var(--brand)}
.f-select{position:relative}
.f-select select{width:100%;appearance:none;-webkit-appearance:none;border:1px solid #E2DCDC;border-radius:12px;padding:10px 36px 10px 12px;background:#fff;font-size:14px;cursor:pointer;outline:0}
.f-select select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(228,0,43,.12)}
.f-select::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.f-count{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.f-count b{color:var(--brand);font-weight:500}
.f-count button{border:0;background:transparent;color:var(--brand);cursor:pointer;font-size:12.5px;padding:0}
#feedList{list-style:none;margin:0;padding:6px 10px 10px;overflow:auto;flex:1;max-height:60vh}
#feedList li{padding:13px 12px;border-radius:14px;cursor:pointer;border-bottom:1px solid #F3EEEE;transition:background .2s}
#feedList li:hover,#feedList li.cur{background:var(--brand-tint)}
#feedList li.new{animation:feedIn .9s ease-out}
@keyframes feedIn{from{background:#FFE9C7;transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
#feedList .f-to{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.3px}
#feedList .f-to .mi{width:15px;height:15px;flex:0 0 auto}
#feedList .f-text{font-size:15px;line-height:1.5;margin-top:5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#feedList .f-text mark{background:#FFE7A8;color:inherit;border-radius:3px;padding:0 1px}
#feedList .f-time{font-size:12px;color:var(--muted);margin-top:5px}
#feedList .f-empty{color:var(--muted);cursor:default;text-align:center;padding:24px 12px;border:0}
#feedList .f-empty:hover{background:transparent}
#feedList .f-more{text-align:center;color:var(--muted);font-size:12.5px;padding:14px;border:0;cursor:default}
#feedList .f-more:hover{background:transparent}

/* Modal */
.modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.show{display:flex}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);width:min(560px,100%);padding:26px;max-height:calc(100vh - 32px);overflow:auto;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 6px;font-size:22px;font-weight:700}
.panel .sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.panel .sub svg{flex:0 0 auto;width:18px;height:18px;color:var(--leaf);margin-top:1px}
.field{margin-bottom:16px}
.field .lbl{display:block;font-weight:500;font-size:14px;margin-bottom:7px}
.field input[type=text],.field input[type=password],.field select,.field textarea{width:100%;border:1px solid #E2DCDC;background:#fff;border-radius:12px;padding:12px 13px;outline:0;transition:border-color .2s,box-shadow .2s;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(228,0,43,.12)}
.field textarea{min-height:130px;resize:vertical;line-height:1.55}
.seg-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-ctl label{border:1px solid #E2DCDC;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;font-size:14px;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.seg-ctl label .ico{font-size:20px}
.seg-ctl label small{font-size:11px;color:var(--muted)}
.seg-ctl input{position:absolute;opacity:0;pointer-events:none}
.seg-ctl label:has(input:checked){border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark);font-weight:500}
.seg-ctl label:has(input:focus-visible){outline:3px solid rgba(228,0,43,.35)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ideas button{border:1px dashed #E2C7CC;background:var(--brand-tint);color:var(--brand-dark);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.ideas button:hover{border-style:solid}
.hint{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.err{color:var(--brand-dark);font-size:14px;min-height:20px;margin:4px 0}
.ok-box{text-align:center;padding:8px 0}
.ok-box .sprout{width:76px;height:76px;margin:0 auto 10px}

/* Cổng PIN */
#gate .panel{text-align:center;width:min(440px,100%)}
#gate .logo-img{height:26px;margin:4px auto 16px}
#gate .hello{font-size:15px;color:var(--muted);margin:0}
#gate h2{font-size:30px;font-weight:900;margin-top:2px}
#gate input{text-align:center;font-size:20px;letter-spacing:4px}
#gate .tiny{font-size:12px;color:var(--muted);margin-top:14px;display:flex;justify-content:center;gap:6px;align-items:center}

.link-btn{border:0;background:transparent;color:var(--brand);cursor:pointer;font-size:13px;margin-top:10px;text-decoration:underline;text-underline-offset:3px}
.feat{display:inline-flex;align-items:center;gap:3px;color:#B9781E;background:#FFF3D6;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;letter-spacing:.2px;text-transform:none;margin-left:4px}
/* Quản trị */
.panel.admin{width:min(880px,100%);height:min(86vh,860px);display:flex;flex-direction:column;padding:22px 24px 18px}
.a-head{display:flex;justify-content:space-between;align-items:center}
.a-head h2{margin:0}
.a-x{border:0;background:transparent;font-size:26px;cursor:pointer;color:var(--muted);width:38px;height:38px;border-radius:50%}
.a-x:hover{background:var(--brand-tint)}
.a-note{margin:6px 0 0;font-size:13px;color:#B9781E;background:#FFF3D6;border-radius:10px;padding:8px 12px}
.a-tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.a-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.a-tabs button b{display:inline-block;min-width:22px;background:#F5EFEF;border-radius:999px;padding:1px 7px;font-size:12px;margin-left:4px}
.a-tabs button.on{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark);font-weight:500}
.a-tabs button.on b{background:var(--brand);color:#fff}
.a-search{margin-bottom:10px}
.a-list{list-style:none;margin:0;padding:0 4px 0 0;overflow:auto;flex:1;min-height:0}
.a-list li{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.a-list li.is-feat{border-color:#F2C46B;background:#FFFBF0}
.a-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;grid-column:1}
.a-meta b{color:var(--ink-2);text-transform:uppercase;font-size:11.5px;letter-spacing:.3px}
.a-meta .mi{width:14px;height:14px}
.a-text{grid-column:1;font-size:15px;line-height:1.5;color:var(--ink-2);white-space:pre-wrap;word-wrap:break-word}
.dp{display:flex;flex-direction:column;flex:1;min-height:0}
.dp-hint{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.dp-list{list-style:none;margin:0;padding:0 4px 0 0;overflow:auto;flex:1;min-height:0}
.dp-list li{display:grid;grid-template-columns:22px 34px 1fr auto auto;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff;transition:box-shadow .2s,border-color .2s}
.dp-list li.drag{opacity:.5}
.dp-list li.over{border-color:var(--brand);box-shadow:0 -3px 0 var(--brand)}
.dp-h{color:#c4b5b8;font-size:17px;cursor:grab;letter-spacing:-3px;user-select:none;text-align:center}
.dp-c{position:relative;width:30px;height:30px;border-radius:9px;box-shadow:0 0 0 1px #eadadd;overflow:hidden;cursor:pointer}
.dp-c input{position:absolute;inset:-8px;width:46px;height:46px;opacity:0;cursor:pointer;border:0;padding:0}
.dp-n{border:1px solid transparent;border-radius:9px;padding:7px 10px;font:inherit;font-size:15px;background:transparent;min-width:0;width:100%}
.dp-n:hover{border-color:var(--line)} .dp-n:focus{border-color:var(--brand);outline:none;background:#fff}
.dp-n.bad{border-color:var(--brand);background:var(--brand-tint)}
.dp-cnt{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dp-a{display:flex;gap:4px}
.dp-a button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#6b5f61;font-size:14px;cursor:pointer}
.dp-a button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.dp-a button:disabled{opacity:.35;cursor:default}
.dp-a .del{color:#C40026}
.dp-add{border:1.5px dashed #E8C3CB;background:#FFF8F9;border-radius:14px;padding:11px;font:inherit;color:#C40026;font-weight:600;width:100%;cursor:pointer;margin-top:4px}
@media (max-width:640px){ .dp-list li{grid-template-columns:18px 30px 1fr auto;gap:8px} .dp-cnt{display:none} }
.a-acts{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center}
.a-acts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px;justify-content:center}
.a-acts button:disabled{opacity:.5;cursor:wait}
.a-acts .ap.on{background:#E8F5EC;border-color:#7DB65A;color:#22603F;font-weight:500}
.a-acts .ft.on{background:#FFF3D6;border-color:#E8A33B;color:#8A5A12;font-weight:700}
.a-empty{text-align:center;color:var(--muted);padding:40px 12px;border:0!important;background:transparent!important;display:block!important}
.a-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);margin-top:6px;font-size:13px;color:var(--muted)}
@media (max-width:640px){ .panel.admin{height:92vh;padding:16px} .a-list li{grid-template-columns:1fr} .a-acts{grid-column:1;grid-row:auto;flex-direction:row} .a-acts button{flex:1} }
#show .s-right{display:flex;align-items:center;gap:10px}
#show .s-mode{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
#show .s-mode button{border:0;background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
#show .s-mode button.on{background:var(--brand);color:#fff;font-weight:700}
#show .s-mode button:disabled{opacity:.4;cursor:not-allowed}

/* Toast */
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,calc(-100% - 40px));background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:50;transition:transform .4s;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}

/* Nút gửi cố định cho điện thoại */
.fab{display:none}

/* Trình chiếu */
#show{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;padding:24px 40px 28px;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);overflow:hidden}
#show.show{display:flex}
#show .s-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex:0 0 auto;position:relative;z-index:3}
#show .s-top img{height:40px;width:auto}
#show .s-title{margin:0;font-size:clamp(20px,2vw,34px);font-weight:900;letter-spacing:-.3px;text-align:center}
#show .s-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:3vw;align-items:center}
#show .s-tree{height:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#show #tree{width:100%;height:100%;max-height:none;min-height:0}
#show .leaf{pointer-events:none}
#show .leaf.spot .shape{animation:pulseBig 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,190,90,1)) drop-shadow(0 0 4px #fff)}
@keyframes pulseBig{0%,100%{transform:scale(1.9)}50%{transform:scale(2.4)}}
.halo{fill:rgba(255,236,160,.6);stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1.4);opacity:.95}50%{transform:scale(2.1);opacity:.55}}
#show .s-msg{text-align:left;padding-right:2vw}
#show .s-to{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(14px,1.3vw,22px);text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--brand);padding:8px 18px;border-radius:999px}
#show .s-to .mi{width:1.2em;height:1.2em;background:#fff;border-radius:50%;padding:2px}
#show .s-text{font-size:clamp(22px,2.6vw,46px);line-height:1.45;font-weight:300;margin:3.5vh 0;white-space:pre-wrap;word-wrap:break-word;transition:opacity .6s,transform .6s}
#show .s-text.fade{opacity:0;transform:translateY(10px)}
#show .s-foot{color:var(--muted);font-size:clamp(13px,1.1vw,18px)}
@media (max-aspect-ratio:1/1){ #show .s-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1.2fr) auto} #show .s-msg{text-align:center;padding:0} #show .s-title{display:none} }
#show .s-progress{position:absolute;left:0;bottom:0;height:5px;background:var(--brand);width:0}

/* Màn vừa: thẻ lời chúc nằm góc phải để không che gốc cây */
@media (min-width:641px) and (max-width:1499px){
}
/* Màn rộng: cột lời chúc mới nhất */
@media (min-width:1500px){
  :root{--feed-w:calc(var(--gutter) + 410px)}
  #feed{position:absolute;top:12px;bottom:20px;right:var(--gutter);width:390px;margin:0}
  #feedList{max-height:none}
  .overview,.stage{padding-right:var(--feed-w)}
  .overview{padding-left:var(--gutter)}
}
@media (min-width:1800px){
  :root{--feed-w:calc(var(--gutter) + 454px)}
  .brand{--L:50px}
  .h-title{font-size:22px} .cd-n{min-width:66px} .cd-n b{font-size:28px} .cd .cd-ico{font-size:46px}
  .btn{font-size:16px;padding:12px 22px}
  .chip{font-size:14px;padding:6px 7px 6px 12px}
  .status{padding:16px 28px} .st-count b{font-size:48px} .st-stage{font-size:17px} .st-next{font-size:14px} .chip .mi{width:18px;height:18px}
  #card{width:400px;padding:16px 20px 12px} #card blockquote{font-size:16px} #card .to{font-size:12.5px}
  #feed{width:430px} .f-search input{font-size:16px}
  #feedList .f-text{font-size:16px}
}
/* Màn vừa: đầu trang 2 hàng, đếm ngược xuống hàng dưới */
@media (max-width:1399px){
  header{grid-template-columns:auto 1fr auto;grid-template-areas:"brand title actions" "cd cd cd";row-gap:12px}
  .brand{grid-area:brand} .h-title{grid-area:title} .actions{grid-area:actions} .cd{grid-area:cd;justify-self:center}
}
/* Màn vừa và nhỏ: thẻ trạng thái nằm dưới cây */
@media (max-width:1099px){
}
/* Điện thoại */
@media (max-width:640px){
  header{grid-template-columns:1fr;grid-template-areas:"brand" "title" "cd";padding:14px 16px;gap:10px;margin-bottom:8px}
  .actions{display:none}
  .brand{--L:28px}
  .h-title{border:0;padding:0;font-size:15px;white-space:normal}
  .cd{justify-self:stretch;gap:6px}
  .cd .cd-ico{font-size:34px} .cd .cd-before{display:none}
  .cd-n{flex:1;min-width:0} .cd-n b{font-size:21px}
  .overview{padding:10px 16px 0}
  .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-right:-16px;padding-right:16px}
  .chip{flex:0 0 auto}
  #tree{max-height:none;min-height:0}
  .status{gap:14px;padding:12px 14px}
  .st-count{flex-direction:column;gap:2px;padding-right:14px;text-align:center} .st-count b{font-size:34px} .st-count span{font-size:11px;max-width:80px}
  .st-head{flex-direction:column;gap:2px} .st-next{font-size:12px}
  #tree{max-height:none}
  .f-search input{font-size:16px}
  .tap-hint{font-size:13px}
  .preview-bar{font-size:12px;padding:6px 12px}
  .seg-ctl{grid-template-columns:1fr}
  .seg-ctl label{flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 14px;text-align:left}
  .seg-ctl label small{margin-left:auto}
  .panel{padding:20px}
  .fab{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,251,249,0),rgba(255,251,249,.95) 35%)}
  .fab .btn{width:100%;padding:14px 18px;font-size:16px}
  body{padding-bottom:76px}
  #show{padding:16px} #show .s-top img{height:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.petals{display:none}}

<body>
<div class="preview-bar"><b data-t="previewLabel"></b> · <span data-t="previewText"></span></div>

<header>
  <div class="brand">
    <img class="logo-img" src="assets/logo-vinrobotics.svg" alt="" width="193" height="29">
  </div>
  <div class="h-title" data-t="headerTitle"></div>
  <div class="cd" id="countdownBox" aria-live="off">
    <span class="cd-ico" aria-hidden="true">🎂</span>
    <span class="cd-before" data-t="countdownBefore"></span>

  <div class="actions">
    <button class="btn" id="btnAdmin" hidden title="Quản trị" aria-label="Quản trị"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="adminButton"></span></button>
    <button class="btn" id="btnShow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span data-t="btnShow"></span></button>

  </div>
</header>

<div class="main">
<section class="overview">
  <div class="status" id="status" aria-live="polite">
    <div class="st-count"><b id="countNum">0</b><span data-t="statusCount"></span></div>
    <div class="st-growth">
      <div class="st-head">
        <div class="st-stage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8" stroke="#5A3824" stroke-width="2.2" stroke-linecap="round"/><path d="M12 14c-5 0-7.5-3.4-7.5-7.5 5 0 7.5 3 7.5 7.5z" fill="#4C9A6A"/><path d="M12 12c0-5 3-8 8-8 0 5-3 8-8 8z" fill="#2F7D57"/></svg><span id="gName"></span></div>
        <div class="st-next" id="gNext"></div>
      </div>
      <div class="bar"><i id="gBar"></i></div>
    </div>
  </div>
  <div class="legend" id="legend" role="group"></div>
</section>

<div class="stage">
  <svg id="tree" viewBox="0 0 1000 980" role="img">
    <defs>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFE7C2" stop-opacity=".95"/>
        <stop offset="55%" stop-color="#FFD9DF" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#FFD9DF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="barkR" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8E6042"/><stop offset="55%" stop-color="#6A4329"/><stop offset="100%" stop-color="#4A2C1C"/></linearGradient>
      <radialGradient id="sunDisc" cx="40%" cy="38%" r="65%"><stop offset="0%" stop-color="#FFF4C2"/><stop offset="55%" stop-color="#FFD15C"/><stop offset="100%" stop-color="#FFAE3B"/></radialGradient>
      <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4A2C1C"/><stop offset="45%" stop-color="#7A4E33"/>
        <stop offset="70%" stop-color="#8E6042"/><stop offset="100%" stop-color="#5A3824"/>
      </linearGradient>
      <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9DFB4"/><stop offset="100%" stop-color="#A9C98F"/></linearGradient>
      <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DCEBCB"/><stop offset="100%" stop-color="#C3DBAC"/></linearGradient>
      <radialGradient id="petal" cx="50%" cy="85%" r="90%">
        <stop offset="0%" stop-color="#FFFFFF"/><stop offset="35%" stop-color="#FFC2CE"/>
        <stop offset="75%" stop-color="#F2405F"/><stop offset="100%" stop-color="#D1002A"/>
      </radialGradient>
      <radialGradient id="shadow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3B5A2A" stop-opacity=".35"/><stop offset="100%" stop-color="#3B5A2A" stop-opacity="0"/></radialGradient>
      <g id="leafGrads"></g>

    <circle cx="500" cy="430" r="470" fill="url(#sun)"/>

    <ellipse cx="500" cy="1075" rx="2200" ry="140" fill="url(#hill2)"/>
    <ellipse cx="500" cy="938" rx="170" ry="16" fill="url(#shadow)"/>

    <g id="birdsG" class="deco"></g>
    <g id="backBots" class="deco"></g>
    <g id="treeScale"><g class="sway"><g id="branches"></g><g id="leaves"></g></g></g>
    <g id="frontBots" class="deco"></g>
    <g id="flyG" class="deco"></g>

  <div class="tap-hint gone" id="tapHint"><span aria-hidden="true">👆</span><b data-t="tapHint" style="font-weight:400"></b></div>

    <h3 data-t="emptyTitle"></h3>
    <p data-t="emptyText"></p>
    <button class="btn primary js-send"><span data-t="emptyButton"></span></button>
  </div>
</div>

<svg id="leader" aria-hidden="true"><path/><circle class="ring" r="9" fill="none" stroke-width="1.3" opacity=".55"/><circle class="dot" r="3.5"/><circle class="end" r="3"/></svg>

</div>

<!-- Gửi lời chúc -->
<div class="modal" id="sendModal" role="dialog" aria-modal="true" aria-labelledby="sendTitle">
  <div class="panel">
    <div id="sendForm">

<script>
/* Toàn bộ thông tin và chữ hiển thị nằm trong config.js */
const CFG = window.SITE_CONFIG || {};
const TXT = CFG.text || {};
const COMPANY = (CFG.company && CFG.company.name) || "";
const EVT = CFG.event || {};
const EVENT_NAME = [EVT.title, EVT.titleHighlight].filter(Boolean).join(" ");
/* phòng ban: mỗi mục là tên, hoặc { name: "...", color: "#RRGGBB" } để tự chọn màu lá */
const parseDepts = arr => (arr || []).map(d => typeof d === "string" ? {name:d.trim()} : {name:String(d && d.name || "").trim(), color:d && d.color}).filter(d=>d.name);
let DEPT_LIST = parseDepts(CFG.departments);
let DEPARTMENTS = DEPT_LIST.map(d=>d.name);
const TIMING = Object.assign({refresh:45, spotlight:6, slide:9}, CFG.timing || {});
const API_URL = ((CFG.backend && CFG.backend.apiUrl) || "").trim();
const PREVIEW = !API_URL;
const DATE_SHORT = (()=>{ const d = new Date(EVT.birthday); if (isNaN(d)) return "";
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit"}).formatToParts(d);
  return p.find(x=>x.type==="day").value + "/" + p.find(x=>x.type==="month").value; })();

const DATE_FULL = (()=>{ const d = new Date(EVT.birthday); if (isNaN(d)) return "";
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit",year:"numeric"}).formatToParts(d);
  return ["day","month","year"].map(k=>p.find(x=>x.type===k).value).join("/"); })();

function t(key, vars={}){
  const s = TXT[key]; if (s == null) return "";
  const all = Object.assign({company:COMPANY, event:EVENT_NAME, date:DATE_SHORT, dateFull:DATE_FULL}, vars);
  return String(s).replace(/\{(\w+)\}/g, (m,k)=> all[k] != null ? all[k] : m);
}
const fill = s => String(s).replace(/\{company\}/g, COMPANY).replace(/\{event\}/g, EVENT_NAME);

const BRAND = "#E4002B";
const PALETTE = ["#2F7D57","#1F8A8A","#7DB65A","#D9A441","#E8743B","#3D6FB6","#7B5BA6","#C2185B","#4C9A6A","#00897B","#AFB42B","#5C6BC0"];
const deptIndex = d => { const i = DEPARTMENTS.indexOf(d); return i >= 0 ? i % PALETTE.length : hash(d) % PALETTE.length; };
const deptColor = d => { const c = (DEPT_LIST[DEPARTMENTS.indexOf(d)]||{}).color; return /^#[0-9a-f]{6}$/i.test(c||"") ? c : PALETTE[deptIndex(d)]; };
/* gradient cho lá theo màu, tạo khi cần */
const GRADS = new Set();
function leafGrad(c){
  const id = "lg" + c.slice(1).toLowerCase();
  if (!GRADS.has(id)){
    GRADS.add(id);
    const lg = el("linearGradient",{id, x1:"0", y1:"0", x2:"1", y2:"1"});
    lg.append(el("stop",{offset:"0%","stop-color":shade(c,.35)}), el("stop",{offset:"55%","stop-color":c}), el("stop",{offset:"100%","stop-color":shade(c,-.28)}));
    $("#leafGrads").appendChild(lg);
  }
  return `url(#${id})`;
}

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs={}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed>>>15, 1|seed); x = x + Math.imul(x ^ x>>>7, 61|x) ^ x; return ((x ^ x>>>14)>>>0)/4294967296; }; }
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").trim();
function save(k,v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function toast(msg){ const x=$("#toast"); x.textContent=msg; x.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("show"),4200); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); const r=n>>16, g=n>>8&255, b=n&255;
  const f = v => Math.round(amt<0 ? v*(1+amt) : v + (255-v)*amt);
  return "#" + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function target(m){
  if (m.toType==="person") return m.toName + (m.toDept ? " · " + m.toDept : "");
  if (m.toType==="dept") return m.toDept;
  return COMPANY;
}
function recipient(m){
  if (m.toType==="person") return t("toPerson",{to:target(m)});
  if (m.toType==="dept") return t("toDept",{to:target(m)});
  return t("toCompany");
}
const colorOf = m => m.toType==="company" ? BRAND : deptColor(m.toDept);
function timeAgo(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = (Date.now()-d)/1000;
  if (s<60) return "vừa xong"; if (s<3600) return Math.floor(s/60)+" phút trước";
  if (s<86400) return Math.floor(s/3600)+" giờ trước";
  return d.toLocaleDateString("vi-VN");
}

/* ---------- áp dụng chữ từ config ---------- */
function applyTexts(){
  document.title = t("pageTitle");
  $$("[data-t]").forEach(n=>{ n.textContent = t(n.dataset.t); });
  $$("[data-ph]").forEach(n=>{ n.placeholder = t(n.dataset.ph); });
  $$(".event-title").forEach(n=>{ n.innerHTML = `${esc(EVT.title||"")} <span class="hl">${esc(EVT.titleHighlight||"")}</span>`; });
  $$(".logo-img").forEach(n=>{ if (CFG.company && CFG.company.logo) n.src = CFG.company.logo; n.alt = COMPANY; });
  $("#tree").setAttribute("aria-label", EVENT_NAME);
  const st = esc(t("showTitle")), hl = esc(EVT.titleHighlight||"");
  $("#sTitle").innerHTML = hl ? st.replace(hl, `<span class="hl">${hl}</span>`) : st;
  $("#gateSub").textContent = PREVIEW ? t("gatePreviewText") : t("gateText");
  $("#pinBtn").textContent = t("gateButton");
}

/* ---------- API ---------- */
let PIN = load("cta_pin") || "";
let ADMIN_PIN = (()=>{ try{ return sessionStorage.getItem("cta_admin") || ""; }catch(e){ return ""; } })();
function saveAdmin(v){ try{ v ? sessionStorage.setItem("cta_admin", v) : sessionStorage.removeItem("cta_admin"); }catch(e){} }
async function api(action, data={}){
  if (PREVIEW) return previewApi(action, data);
  const res = await fetch(API_URL, { method:"POST", body: JSON.stringify({ action, pin: PIN, adminPin: ADMIN_PIN, ...data }) });
  if (!res.ok) throw new Error(t("netError"));
  return res.json();
}

/* ---------- lời chúc mẫu (bản xem trước) ---------- */
let sample = null;
function previewApi(action, data){
  if (!sample){
    const P = CFG.previewSamples || {}, texts = (P.texts||[]).map(fill), names = P.names||[], r = rng(11);
    sample = Array.from({length: texts.length ? (P.count||60) : 0}, (_,i)=>{
      const x = r(), dept = DEPARTMENTS[Math.floor(r()*DEPARTMENTS.length)] || "";
      const toType = x<.33 || !dept ? "company" : x<.68 || !names.length ? "dept" : "person";
      return { id:"p"+i, time:new Date(Date.now()-r()*6*864e5).toISOString(), toType,
        toDept: toType==="company" ? "" : dept, toName: toType==="person" ? names[Math.floor(r()*names.length)] : "",
        text: texts[Math.floor(r()*texts.length)], approved: i < (P.count||60) - 6, featured: i % 11 === 3 };
    });
  }
  const pub = () => sample.filter(m=>m.approved);
  const pDepts = () => { try{ return JSON.parse(load("cta_prev_depts") || "null"); }catch(e){ return null; } };
  if (action==="adminSetDepts"){
    Object.keys(data.renames||{}).forEach(o=>sample.forEach(m=>{ if (m.toDept===o) m.toDept = data.renames[o]; }));
    save("cta_prev_depts", JSON.stringify(data.depts)); return Promise.resolve({ok:true, depts:data.depts});
  }
  if (action==="verify" || action==="adminVerify") return Promise.resolve({ok:true});
  if (action==="list") return Promise.resolve({ok:true, items: pub().map(m=>Object.assign({}, m)), depts: pDepts()});
  if (action==="adminList") return Promise.resolve({ok:true, items: sample.map(m=>Object.assign({}, m)), depts: pDepts()});
  if (action==="adminSet"){
    const m = sample.find(x=>x.id===data.id); if (!m) return Promise.resolve({ok:false});
    if (typeof data.featured === "boolean"){ m.featured = data.featured; if (data.featured) m.approved = true; }
    if (typeof data.approved === "boolean"){ m.approved = data.approved; if (!data.approved) m.featured = false; }
    return Promise.resolve({ok:true, approved:m.approved, featured:m.featured});
  }
  if (action==="submit"){
    const m = { id:"p"+Date.now(), time:new Date().toISOString(), toType:data.toType,
      toDept: data.toType==="company" ? "" : data.toDept, toName: data.toType==="person" ? data.toName : "", text:data.text, approved:true, featured:false };
    sample.push(m); return Promise.resolve({ok:true, id:m.id});
  }
}

/* ---------- cây: thân và cành dựng theo logo VinRobotics ----------
   Logo gồm hai nét ngoài tạo chữ V và hai nét trong bắt chéo nhau ở giữa,
   cả bốn nét gặp nhau từng cặp ở hai đỉnh trên. Cây dựng đúng cấu trúc đó:
   thân = mũi nhọn chữ V; hai cành ngoài = hai cạnh chữ V; hai cành trong
   bắt chéo phía trên chạc rồi vươn lên gặp cành ngoài ở hai đỉnh. */
const MAXD = 7, BASE = {x:500, y:930};
const FORK = {x:500, y:BASE.y-165};
const TIP_DX = 230, TIP_DY = 290;
const SEGS = (function buildTree(){
  const r = rng(20261121), segs = [];
  const push = (x1,y1,cx,cy,x2,y2,w,w2,depth)=>{ segs.push({x1,y1,cx,cy,x2,y2,w,w2,depth,ang:Math.atan2(y2-y1,x2-x1)}); };
  const quad = (a,c,b,t)=>{ const u=1-t; return [u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]; };
  function branch(x,y,ang,len,w,depth){
    const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
    const bend = (r()-.5)*len*.22;
    const w2 = depth>=MAXD ? Math.max(1.2,w*.45) : Math.max(1.4,w*.68);
    push(x,y,(x+x2)/2+Math.cos(ang+Math.PI/2)*bend,(y+y2)/2+Math.sin(ang+Math.PI/2)*bend,x2,y2,w,w2,depth);
    if (depth>=MAXD) return;
    const n = r()<.3 ? 3 : 2;
    for (let i=0;i<n;i++){
      const spread = .28 + r()*.26;
      let a = n===2 ? ang + (i ? spread : -spread) : ang + (i-1)*spread*1.1;
      a += (r()-.5)*.2;
      a = a*.8 + (-Math.PI/2)*.2;
      branch(x2,y2,a,len*(.68+r()*.1),w2,depth+1);
    }
  }
  /* thân: mũi nhọn của chữ V */
  push(BASE.x,BASE.y, BASE.x+2,(BASE.y+FORK.y)/2, FORK.x,FORK.y, 56, 40, 0);
  [-1,1].forEach(side=>{
    const tip = [FORK.x + side*TIP_DX, FORK.y - TIP_DY];
    /* cành ngoài: cạnh chữ V, hơi phình ra như viền logo */
    const oS = [FORK.x + side*10, FORK.y], oC = [FORK.x + side*(TIP_DX*.62), FORK.y - TIP_DY*.32];
    push(oS[0],oS[1], oC[0],oC[1], tip[0],tip[1], 30, 16, 1);
    /* cành trong: xuất phát phía đối diện, bắt chéo ở giữa rồi vươn lên gặp đỉnh */
    const iS = [FORK.x - side*9, FORK.y - 4], iC = [FORK.x + side*(TIP_DX*.18), FORK.y - TIP_DY*.86];
    push(iS[0],iS[1], iC[0],iC[1], tip[0]-side*6, tip[1]+4, 20, 12, 1);
    /* tán lá mọc từ đỉnh và dọc hai cành */
    branch(tip[0],tip[1], -Math.PI/2 + side*.55, 100, 15, 2);
    branch(tip[0],tip[1], -Math.PI/2 + side*.05, 108, 14, 2);
    const om = quad(oS,oC,tip,.55); branch(om[0],om[1], -Math.PI/2 + side*.95, 92, 13, 2);
    const im = quad(iS,iC,[tip[0]-side*6, tip[1]+4],.6); branch(im[0],im[1], -Math.PI/2 - side*.12, 96, 11, 2);
  });
  return segs;
})();

/* ---------- cảnh vật: mặt trời, chim, bướm, robot ---------- */
let CAM = {x:0, y:0, w:1000, h:980}, TREE = {top:500, sc:1}, VIS = {x:0, w:1000};
/* vùng thật sự nhìn thấy (khung SVG có thể rộng hơn viewBox) */
function updateVis(){
  const r = $("#tree").getBoundingClientRect();
  const vw = (r.width && r.height) ? Math.max(CAM.w, CAM.h*r.width/r.height) : CAM.w;
  const changed = Math.abs(vw - VIS.w) > .5;
  VIS = {x:500 - vw/2, w:vw};
  if (changed && $("#sunG").firstChild) placeSun();
}
const REDUCED = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();

function buildSun(){
  const g = $("#sunG"); g.textContent = "";
  const rays = el("g",{class:"sun-rays"});
  for (let i=0;i<12;i++) rays.appendChild(el("rect",{x:"-3", y:"-74", width:"6", height:"18", rx:"3", fill:"#FFC94D", opacity:".85", transform:`rotate(${i*30})`}));
  g.append(rays, el("circle",{r:"48", fill:"url(#sunDisc)"}), el("circle",{r:"48", fill:"none", stroke:"#FFE7A3", "stroke-width":"3", opacity:".7"}));
}
function placeSun(){
  const k = CAM.h/980;
  $("#sunG").setAttribute("transform", `translate(${Math.max(VIS.x + 60*k, CAM.x + CAM.w*.06 - 30*k).toFixed(1)},${(CAM.y + CAM.h*.1).toFixed(1)}) scale(${k.toFixed(3)})`);
}

/* robot dạng người: trắng, điểm đỏ thương hiệu, mặt kính đen mắt xanh */
function makeRobot(kind){

  const legB = leg(-9.5), legF = leg(2.5);
  const armB = el("g"); armB.appendChild(el("rect",{x:"-3", y:"-49", width:"6", height:"20", rx:"3", fill:"#D9D2D2"}));
  const torso = el("g");
  torso.append(
    el("rect",{x:"-13", y:"-54", width:"26", height:"31", rx:"9", fill:"#FFFFFF", stroke:"#E0D8D8", "stroke-width":"1"}),
    el("rect",{x:"-13", y:"-31", width:"26", height:"5", fill:"#E4002B", opacity:".9"}),
    el("circle",{cx:"4", cy:"-43", r:"4.5", fill:"#E4002B"}),
    el("circle",{cx:"4", cy:"-43", r:"1.8", fill:"#FFFFFF"}));
  const head = el("g");
  head.append(
    el("line",{x1:"0", y1:"-76", x2:"0", y2:"-83", stroke:"#BDB5B5", "stroke-width":"2", "stroke-linecap":"round"}),
    el("circle",{cx:"0", cy:"-85", r:"3", fill:"#E4002B"}),
    el("rect",{x:"-13", y:"-77", width:"26", height:"22", rx:"9", fill:"#FFFFFF", stroke:"#E0D8D8", "stroke-width":"1"}),
    el("rect",{x:"-7", y:"-72", width:"18", height:"11", rx:"5.5", fill:"#1C1F24"}),
    el("circle",{cx:"0", cy:"-66.5", r:"2", fill:"#6FE7FF"}),
    el("circle",{cx:"6.5", cy:"-66.5", r:"2", fill:"#6FE7FF"}));
  const armF = el("g"); armF.appendChild(el("rect",{x:"-3", y:"-49", width:"6", height:"21", rx:"3", fill:"#EFEAEA", stroke:"#D9D2D2", "stroke-width":".8"}));
  const fx = {};
  if (kind==="water"){
    /* bình tưới: tay cầm ở trên, vòi chĩa về phía trước; gốc tọa độ = bàn tay */
    const can = el("g");
    can.append(
      el("path",{d:"M-8,-1 q8,-12 16,0", stroke:"#B80023", "stroke-width":"2.4", fill:"none", "stroke-linecap":"round"}),
      el("path",{d:"M-9,0 h18 l-2,15 h-14 z", fill:"#E4002B"}),
      el("rect",{x:"-9", y:"5", width:"18", height:"2.5", fill:"#B80023", opacity:".6"}),
      el("path",{d:"M8,9 L21,2", stroke:"#E4002B", "stroke-width":"3.2", "stroke-linecap":"round"}),
      el("path",{d:"M20,-1 l6,1.6 l-1.6,5 l-6,-1.6 z", fill:"#B80023"}));
    armF.appendChild(can); fx.can = can;
    const streams = el("g",{opacity:"0"});
    fx.streams = [0,1,2].map(()=>{ const p = el("path",{fill:"none", stroke:"#5FB8FF", "stroke-width":"1.4", "stroke-linecap":"round", "stroke-dasharray":"2.5 3.5", opacity:".95"}); streams.appendChild(p); return p; });
    fx.dropG = streams;
  } else if (kind==="shears"){
    const sh = el("g",{transform:"translate(0,-27) rotate(90)"});
    const bladeA = el("g"), bladeB = el("g");
    bladeA.append(el("path",{d:"M0,0 L18,-3 L18,0 Z", fill:"#8A9097"}), el("circle",{cx:"-5", cy:"3", r:"3.5", fill:"none", stroke:"#E4002B", "stroke-width":"2"}));
    bladeB.append(el("path",{d:"M0,0 L18,3 L18,0 Z", fill:"#6B7178"}), el("circle",{cx:"-5", cy:"-3", r:"3.5", fill:"none", stroke:"#E4002B", "stroke-width":"2"}));
    sh.append(bladeA, bladeB, el("circle",{r:"1.6", fill:"#2A2A2A"}));
    armF.appendChild(sh); fx.bladeA = bladeA; fx.bladeB = bladeB;
    const bits = el("g",{opacity:"0"}); fx.bits = [];
    for (let i=0;i<3;i++){ const b = el("path",{d:"M0,0 c3,-3 7,-2 8,0 c-3,3 -7,2 -8,0z", fill:["#7DB65A","#2F7D57","#4C9A6A"][i]}); bits.appendChild(b); fx.bits.push(b); }
    fx.bitG = bits;

  body.append(legB, legF, armB, torso, head, armF);
  if (fx.balloon) body.insertBefore(fx.balloon, body.firstChild);
  g.appendChild(body);
  if (fx.dropG) g.appendChild(fx.dropG);
  if (fx.bitG) g.appendChild(fx.bitG);
  return {g, body, legB, legF, armB, armF, fx};

const BOTS = [];
function buildBots(){
  $("#frontBots").textContent = ""; $("#backBots").textContent = ""; BOTS.length = 0;
  const add = (kind, layer, cfg) => { const b = makeRobot(kind); $(layer).appendChild(b.g); BOTS.push(Object.assign(b, {kind, x:null, dir:1, state:"walk", timer:0, phase:Math.random()*6}, cfg)); };
  add("water",   "#frontBots", {y:956, scale:1,   speed:26, side:-1});

function botRange(b){
  const s = robotScale()*b.scale, trunk = 34*TREE.sc + 20*s;
  const half = Math.min(VIS.w/2, CAM.w*.62), L = 500 - half*.88, R = 500 + half*.88;
  if (b.side<0) return {home:L, work:BASE.x - trunk - 14*s};
  if (b.side>0) return {home:R, work:BASE.x + trunk + 14*s};
  return {home:L, work:R};
}
const robotScale = () => Math.min(2.1, Math.max(1.15, CAM.h/980*2.1));

function updateBot(b, dt, now){
  const {home, work} = botRange(b), s = robotScale()*b.scale;
  if (b.x == null) b.x = b.side<0 ? home + (work-home)*.35 : b.side>0 ? home - (home-work)*.4 : home;
  let walking = false, acting = false;
  if (b.state==="walk"){
    const target = b.goWork === false ? home : work;
    const d = target - b.x, step = b.speed*s*dt;
    b.dir = d>=0 ? 1 : -1;
    if (Math.abs(d) <= step){ b.x = target; b.state = b.goWork===false ? "rest" : "act"; b.timer = b.goWork===false ? 1.6 : (b.kind==="balloon" ? .4 : 4.2); }
    else { b.x += Math.sign(d)*step; walking = true; }
  } else {
    b.timer -= dt; acting = b.state==="act";
    if (b.timer<=0){ b.goWork = b.state==="rest"; b.state = "walk"; }
  }
  if (b.state==="act" && b.side) b.dir = b.side<0 ? 1 : -1;
  b.phase += dt*(walking ? 9 : 0);
  const sw = walking ? Math.sin(b.phase) : 0, bob = walking ? Math.abs(Math.cos(b.phase))*1.6 : 0;
  b.g.setAttribute("transform", `translate(${b.x.toFixed(1)},${b.y}) scale(${(s*b.dir).toFixed(3)},${s.toFixed(3)})`);
  b.body.setAttribute("transform", `translate(0,${(-bob).toFixed(2)})`);
  b.legB.setAttribute("transform", `rotate(${(-sw*24).toFixed(1)} -6 -24)`);
  b.legF.setAttribute("transform", `rotate(${(sw*24).toFixed(1)} 6 -24)`);
  b.armB.setAttribute("transform", `rotate(${(sw*20).toFixed(1)} 0 -46)`);
  let armA = -sw*18;
  if (b.kind==="water") armA = acting ? -78 : -18 - sw*8;
  if (b.kind==="shears") armA = acting ? -128 + Math.sin(now/180)*6 : -35 - sw*8;
  if (b.kind==="balloon") armA = -150;
  b.armF.setAttribute("transform", `rotate(${armA.toFixed(1)} 0 -46)`);
  if (b.fx.can){
    /* bình luôn đứng thẳng khi đi; khi tưới thì nghiêng 38° cho vòi chúc xuống */
    const tilt = acting ? 38 : 0, R = d=>d*Math.PI/180;
    b.fx.can.setAttribute("transform", `translate(0,-28) rotate(${(-armA + tilt).toFixed(1)})`);
    b.fx.dropG.setAttribute("opacity", acting ? "1" : "0");
    if (acting){
      /* vị trí bàn tay và đầu vòi trong hệ tọa độ robot */
      const ha = R(armA), hX = -18*Math.sin(ha), hY = -46 + 18*Math.cos(ha);
      const ta = R(tilt), tipX = hX + 25*Math.cos(ta) - 2.5*Math.sin(ta), tipY = hY + 25*Math.sin(ta) + 2.5*Math.cos(ta);
      b.fx.streams.forEach((p,i)=>{
        const a0 = ta + R((i-1)*20), v = 46 + (i===1?8:0), g = 90;
        let d = `M${tipX.toFixed(1)},${tipY.toFixed(1)}`;
        for (let k=1;k<=14;k++){ const tt = k*.05, x = tipX + Math.cos(a0)*v*tt, y = tipY + Math.sin(a0)*v*tt + g*tt*tt; d += ` L${x.toFixed(1)},${Math.min(-1, y).toFixed(1)}`; if (y >= -1) break; }
        p.setAttribute("d", d); p.setAttribute("stroke-dashoffset", (-(now/40) % 8).toFixed(1));
      });
    }
  }
  if (b.fx.bladeA){
    const open = acting ? 10 + Math.sin(now/90)*10 : 4;
    b.fx.bladeA.setAttribute("transform", `rotate(${-open})`); b.fx.bladeB.setAttribute("transform", `rotate(${open})`);
    b.fx.bitG.setAttribute("opacity", acting ? "1" : "0");
    if (acting) b.fx.bits.forEach((p,i)=>{ const t=((now/1400)+i/3)%1; p.setAttribute("transform", `translate(${(-14 - i*6 + Math.sin(t*9)*4).toFixed(1)},${(-122 + t*120).toFixed(1)}) rotate(${(t*300).toFixed(0)})`); p.setAttribute("opacity",(1-t).toFixed(2)); });
  }
  if (b.fx.balloon) b.fx.balloon.setAttribute("transform", `rotate(${(Math.sin(now/700)*4).toFixed(1)} 2 -30)`);
}

let lastT = 0, frameN = 0;

/* giai đoạn: tên và mốc lấy từ config, độ lớn tính tự động */
const STAGES = (function(){
  const src = (CFG.stages && CFG.stages.length) ? CFG.stages.slice().sort((a,b)=>a.min-b.min) : [{min:0,name:""}];
  const n = src.length;
  return src.map((s,i)=>({ min:s.min, name:s.name,
    depth: n===1 ? MAXD : Math.max(1, Math.round(1 + i*(MAXD-1)/(n-1))),
    scale: n===1 ? 1 : .42 + i*(.58/(n-1)) }));
})();
const stageIdx = n => STAGES.reduce((k,x,i)=> n>=x.min ? i : k, 0);

function buildGrass(){

function segPath(s){
  /* pháp tuyến tính theo tiếp tuyến tại từng điểm để cành cong vẫn thuôn đều */
  const nrm = (dx,dy)=>{ const l=Math.hypot(dx,dy)||1; return [-dy/l, dx/l]; };
  const n1 = nrm(s.cx-s.x1, s.cy-s.y1), n2 = nrm(s.x2-s.cx, s.y2-s.cy), nm = nrm(s.x2-s.x1, s.y2-s.y1);
  const h1 = s.w/2, h2 = s.w2/2, hm = (h1+h2)/2;
  const p = (x,y,n,k)=>`${(x+n[0]*k).toFixed(1)},${(y+n[1]*k).toFixed(1)}`;
  return `M${p(s.x1,s.y1,n1,h1)} Q${p(s.cx,s.cy,nm,hm)} ${p(s.x2,s.y2,n2,h2)} L${p(s.x2,s.y2,n2,-h2)} Q${p(s.cx,s.cy,nm,-hm)} ${p(s.x1,s.y1,n1,-h1)} Z`;
}
function drawTree(stage){

function leafShape(m, size, r){

    g.appendChild(el("path",{d:`M${s*.04},0 Q${s*.6},${-s*.04} ${s*1.12},0`, stroke:"rgba(255,255,255,.6)", "stroke-width":"1.1", fill:"none"}));
    for (let i=1;i<=3;i++){ const x=s*(.25*i); g.appendChild(el("path",{d:`M${x},0 l${s*.12},${-s*.13} M${x},0 l${s*.12},${s*.13}`, stroke:"rgba(255,255,255,.35)", "stroke-width":".8", fill:"none"})); }
  }

}
function placeLeaf(m, stage, cands){
  const h = hash(m.id), r = rng(h);
  const s = cands[h % cands.length];
  const tt = .25 + r()*.75, u = 1-tt;
  const x = u*u*s.x1 + 2*u*tt*s.cx + tt*tt*s.x2, y = u*u*s.y1 + 2*u*tt*s.cy + tt*tt*s.y2;
  const side = r()<.5 ? -1 : 1, off = ((s.w+s.w2)/4 + 1 + r()*12) * side;
  const px = x + -Math.sin(s.ang)*off, py = y + Math.cos(s.ang)*off;
  const rot = (s.ang*180/Math.PI) + side*(30+r()*50);
  const size = (m.toType==="company" ? 22 : 21) / stage.scale;
  return {x:px, y:py, rot, size, r};
}

/* đặt thẻ lời chúc ra khoảng trống xa tán cây, nối với chiếc lá bằng một đường mảnh */
function placeCallout(le, scroll){
  const c = $("#card"), main = $(".main"), ld = $("#leader");
  if (!le){ c.classList.remove("show"); ld.classList.remove("show"); return; }
  let r = le.getBoundingClientRect();
  if (scroll && (r.top < 80 || r.bottom > innerHeight - 40)){ le.scrollIntoView({block:"center"}); r = le.getBoundingClientRect(); }
  const mr = main.getBoundingClientRect(), st = $(".stage").getBoundingClientRect(), cv = $("#treeScale").getBoundingClientRect();
  const feedEl = $("#feed"), wideFeed = getComputedStyle(feedEl).position === "absolute";
  const rightEdge = wideFeed ? feedEl.getBoundingClientRect().left - 28 : Math.min(innerWidth, st.right) - 16;
  const room = rightEdge - cv.right - 24, side = room >= 300;
  c.style.width = side ? Math.min(400, room).toFixed(0) + "px" : "";
  const w = c.offsetWidth, h = c.offsetHeight;
  const lx = r.left + r.width/2, ly = r.top + r.height/2;
  let L, T, ex, ey, d;
  if (side){
    /* màn rộng: khung nằm ở khoảng trời bên phải */
    L = rightEdge - w;
    T = Math.max(st.top + 40, 16); T = Math.min(T, innerHeight - h - 16);
    ex = L; ey = T + h*0.7;
    d = `M${lx},${ly} C${lx+130},${ly} ${ex-150},${ey} ${ex},${ey}`;
  } else {
    /* màn hẹp: khung nằm dưới chân cây, đè lên cỏ */
    L = Math.max(12, (innerWidth - w)/2);
    T = Math.min(st.bottom, innerHeight) - h - 10; T = Math.max(T, ly + 40);
    ex = L + w/2; ey = T;
    d = `M${lx},${ly} C${lx},${ly+80} ${ex},${ey-80} ${ex},${ey}`;
  }
  c.style.left = (L - mr.left).toFixed(0) + "px";
  c.style.top = (T - mr.top).toFixed(0) + "px";
  const acc = getComputedStyle(c).getPropertyValue("--accent").trim() || BRAND;
  ld.style.left = (-mr.left) + "px"; ld.style.top = (-mr.top) + "px";
  const path = ld.querySelector("path"); path.setAttribute("d", d); path.setAttribute("stroke", acc);
  ld.querySelector(".ring").setAttribute("stroke", acc);
  [[".ring",lx,ly],[".dot",lx,ly],[".end",ex,ey]].forEach(([q,x,y])=>{ const e = ld.querySelector(q); e.setAttribute("cx",x.toFixed(1)); e.setAttribute("cy",y.toFixed(1)); if (q!==".ring") e.setAttribute("fill",acc); });
  ld.style.setProperty("--len", Math.ceil(path.getTotalLength()) + "px");
  ld.classList.remove("show"); void ld.getBoundingClientRect();
  requestAnimationFrame(()=>{ c.classList.add("show"); ld.classList.add("show"); });
}

function highlight(text, q){
  const safe = esc(text); if (!q) return safe;
  const n = norm(text), i = n.indexOf(q);
  if (i < 0 || n.length !== text.length) return safe;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
/* cuộn vô hạn: hiện 30 lời chúc, cuộn gần cuối thì nạp tiếp */
const FEED_PAGE = 30;
let feedSrc = [], feedShown = 0, feedFresh = new Set(), feedQ = "", feedFiltered = null, feedObs = null;
function feedItem(m){
  const li = document.createElement("li"); if (feedFresh.has(m.id)) li.className = "new";
  const to = document.createElement("div"); to.className="f-to"; to.style.color = shade(colorOf(m),-.15);
  to.innerHTML = miniIcon(m); to.appendChild(document.createTextNode(recipient(m)));
  if (m.featured) to.insertAdjacentHTML("beforeend", `<span class="feat">★ ${esc(t("featuredBadge"))}</span>`);
  const tx = document.createElement("div"); tx.className="f-text"; tx.innerHTML = highlight(m.text, feedQ);
  const tm = document.createElement("div"); tm.className="f-time"; tm.textContent = timeAgo(m.time);
  li.append(to, tx, tm); li.onclick = ()=>showCard(m,"open", feedFiltered || items);
  return li;
}
function feedMore(n){
  const ul = $("#feedList"), sentinel = $("#feedMore"), end = Math.min(feedSrc.length, feedShown + (n||FEED_PAGE));
  const frag = document.createDocumentFragment();
  for (let i=feedShown; i<end; i++) frag.appendChild(feedItem(feedSrc[i]));
  ul.insertBefore(frag, sentinel); feedShown = end;
  sentinel.hidden = feedShown >= feedSrc.length;
}
function renderFeed(fresh, keep=false){
  fresh = fresh || new Set();
  const ul = $("#feedList"), top = ul.scrollTop, had = feedShown;
  feedFiltered = filtered(); feedQ = norm($("#q").value); feedFresh = fresh || new Set();
  $("#feedTitle").textContent = feedFiltered ? t("feedResults") : t("feedTitle");
  $("#feedLive").hidden = !!feedFiltered;
  feedSrc = (feedFiltered || items).slice().sort((a,b)=>String(b.time).localeCompare(String(a.time)));
  ul.textContent = ""; feedShown = 0;
  const sentinel = document.createElement("li"); sentinel.id = "feedMore"; sentinel.className = "f-more"; sentinel.textContent = t("feedLoading") || "…";
  ul.appendChild(sentinel);
  if (!feedSrc.length){ sentinel.hidden = true; const li=document.createElement("li"); li.className="f-empty"; li.textContent = feedFiltered ? t("feedNoMatch") : t("feedEmpty"); ul.insertBefore(li, sentinel); return; }
  feedMore(keep ? Math.max(FEED_PAGE, had + fresh.size) : FEED_PAGE);
  ul.scrollTop = keep ? top : 0;
  if (!feedObs && "IntersectionObserver" in window){
    feedObs = new IntersectionObserver(es=>{ if (es.some(e=>e.isIntersecting)) feedMore(); }, {root: ul, rootMargin:"0px 0px 300px 0px"});
  }
  if (feedObs){ feedObs.disconnect(); feedObs.observe(sentinel); }
}

    const have = new Set(incoming.map(m=>m.id));
    mine.forEach((m,id)=>{ if (have.has(id) || Date.now() - new Date(m.time) > 180000) mine.delete(id); else incoming.push(m); });
    if (!first) incoming.forEach(m=>{ if (!byId.has(m.id)) fresh.add(m.id); });
    items = incoming.sort((a,b)=> String(a.time).localeCompare(String(b.time)));
    byId = new Map(items.map(m=>[m.id,m]));
    loaded = true;
    renderLeaves(fresh); updateLegend();
    if (first) maybeShowHint();
    if (fresh.size){
      const last = items.find(m=>fresh.has(m.id));
      const ul = $("#feedList"), feedSide = getComputedStyle($("#feed")).position === "absolute";
      if (ul.scrollTop > 40){ const pill = $("#feedNew"); pill.textContent = t("feedNewPill",{n:fresh.size}); pill.hidden = false; }
      if (!feedSide) toast(fresh.size===1 ? t("toastNewOne",{to:target(last)}) : t("toastNewMany",{n:fresh.size}));
    }
    refresh.fails = 0;
  }catch(e){
    /* máy chủ bận hoặc mạng chập chờn: tự thử lại sau vài giây, giãn dần, lệch nhau giữa các máy */
    refresh.fails = (refresh.fails||0) + 1;
    if (!silent && refresh.fails > 2) toast(t("loadError"));
    if (refresh.fails <= 5){ clearTimeout(refresh.retry); refresh.retry = setTimeout(()=>refresh(true), (3 + Math.random()*5) * 1000 * refresh.fails); }
  }
}

document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && started && Date.now() - (refresh.at||0) > TIMING.refresh*1000) refresh(true); });

/* ---------- đếm ngược ---------- */
function setupCountdown(){
  const when = new Date(EVT.birthday), box = $("#countdownBox");
  if (isNaN(when)) { box.hidden = true; return; }
  const dateStr = when.toLocaleDateString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit",year:"numeric"});
  $("#countdownLbl").textContent = t("countdownAfter",{date:dateStr});
  $("#countdownLbl").hidden = !t("countdownAfter");
  const pad = n => String(n).padStart(2,"0");
  (function tick(){
    const ms = when - Date.now();
    if (ms > 0){
      const s = Math.floor(ms/1000);
      $("#cdD").textContent = Math.floor(s/86400); $("#cdH").textContent = pad(Math.floor(s%86400/3600));
      $("#cdM").textContent = pad(Math.floor(s%3600/60)); $("#cdS").textContent = pad(s%60);
    } else if (ms > -864e5){ box.classList.add("today"); box.textContent = t("countdownToday"); return; }
    else { box.hidden = true; return; }
    setTimeout(tick, 1000 - (Date.now() % 1000));
  })();
}

/* ---------- cánh hoa rơi ---------- */
function setupPetals(){
  const box = $("#petals"), r = rng(3), n = window.innerWidth < 640 ? 6 : 14;
  for (let i=0;i<n;i++){
    const s = document.createElement("span"), k = .6 + r()*.7;
    s.style.left = (r()*100)+"vw"; s.style.animationDuration = (14+r()*12)+"s"; s.style.animationDelay = (-r()*20)+"s";
    s.style.width = (14*k)+"px"; s.style.height = (11*k)+"px"; s.style.opacity = (.35+r()*.45).toFixed(2);
    box.appendChild(s);
  }
}

/* ---------- PIN ---------- */
function showGate(msg){ $("#pinErr").textContent = msg || ""; openModal("#gate"); setTimeout(()=>$("#pin").focus(),60); }
async function tryPin(){
  const v = $("#pin").value.trim(); if (!v) return;
  const btn = $("#pinBtn"); btn.disabled = true; btn.textContent = t("gateChecking"); PIN = v;
  try{
    const res = await api("verify");
    if (!res.ok){ $("#pinErr").textContent = res.code==="BAD_PIN" ? t("pinWrong") : (res.error || t("pinWrong")); PIN=""; return; }
    save("cta_pin", v); $("#gate").classList.remove("show"); start();
  }catch(e){ $("#pinErr").textContent = t("netError"); PIN=""; }
  finally{ btn.disabled=false; btn.textContent=t("gateButton"); }
}
$("#pinBtn").onclick = tryPin;
$("#pin").addEventListener("keydown", e=>{ if (e.key==="Enter") tryPin(); });

let started = false, poll = null;
function start(){
  if (started) return; started = true;
  spotAfter = Date.now() + 10000;
  /* lệch thời điểm tải giữa các máy để 150 người mở cùng lúc không dồn vào một giây */
  setTimeout(()=>refresh(false), Math.random()*400);
  clearTimeout(poll);
  (function loop(){ poll = setTimeout(()=>{ if (!document.hidden) refresh(true); loop(); }, TIMING.refresh*1000*(0.85 + Math.random()*0.3)); })();
}

/* ---------- khởi động ---------- */
if (PREVIEW) document.body.classList.add("preview");
applyTexts(); buildLeafGradients(); setupScene(); buildGrass(); buildLegend(); syncType(); setupCountdown(); setupPetals();
drawTree(STAGES[0]); currentStage = STAGES[0]; renderLeaves();
/* ---------- quản trị ---------- */
let adminItems = [], adminTab = "pending";
function openAdminGate(){ $("#adminErr").textContent=""; $("#adminPin").value=""; openModal("#adminGate"); setTimeout(()=>$("#adminPin").focus(),60); }
async function tryAdmin(){
  const v = $("#adminPin").value.trim(); if (!v) return;
  const btn = $("#adminBtn"); btn.disabled = true; const old = ADMIN_PIN; ADMIN_PIN = v;
  try{
    const res = await api("adminVerify");
    if (!res.ok){ ADMIN_PIN = old; $("#adminErr").textContent = t("pinWrong"); return; }
    saveAdmin(v); $("#adminGate").classList.remove("show"); $("#btnAdmin").hidden = false;
    if (!PIN){ PIN = v; $("#gate").classList.remove("show"); start(); }   /* PIN quản trị cũng vào được trang */
    openAdmin();
  }catch(e){ ADMIN_PIN = old; $("#adminErr").textContent = t("netError"); }
  finally{ btn.disabled = false; }
}
async function openAdmin(){
  if (!ADMIN_PIN) return openAdminGate();
  $("#aNote").hidden = !PREVIEW; openModal("#adminPanel"); $("#aList").innerHTML = `<li class="a-empty">…</li>`;
  try{
    const res = await api("adminList");
    if (!res.ok){ ADMIN_PIN = ""; saveAdmin(""); $("#btnAdmin").hidden = true; $("#adminPanel").classList.remove("show"); return openAdminGate(); }
    adminItems = (res.items||[]).sort((a,b)=>String(b.time).localeCompare(String(a.time)));
    if (Array.isArray(res.depts)) applyDepts(res.depts);
    if (!dpDirty) dpInit();
    if (adminTab==="pending" && !adminItems.some(m=>!m.approved)) adminTab = "approved";
    renderAdmin();
  }catch(e){ $("#aList").innerHTML = `<li class="a-empty">${esc(t("netError"))}</li>`; }
}
let dpRows = null, dpDirty = false;
function dpInit(){ dpRows = DEPT_LIST.map(d=>({name:d.name, orig:d.name, color:deptColor(d.name)})); dpDirty = false; }
function dpRender(){
  const ul = $("#dpList"); ul.textContent = "";
  const cnt = {}; adminItems.forEach(m=>{ if (m.toDept) cnt[m.toDept] = (cnt[m.toDept]||0) + 1; });
  const names = dpRows.map(r=>norm(r.name));
  dpRows.forEach((row,i)=>{
    const li = document.createElement("li"); li.draggable = false;
    const dup = !row.name.trim() || names.indexOf(norm(row.name)) !== i;
    li.innerHTML = `<span class="dp-h" title="Kéo để đổi thứ tự">⋮⋮</span>
      <label class="dp-c" style="background:${row.color}" title="Đổi màu lá"><input type="color" value="${row.color}"></label>
      <input class="dp-n${dup?" bad":""}" maxlength="60" value="${esc(row.name)}">
      <span class="dp-cnt">${esc(t("adminDeptCount",{n:cnt[row.orig]||0}))}</span>
      <span class="dp-a"><button type="button" class="up" title="Lên"${i?"":" disabled"}>↑</button><button type="button" class="dn" title="Xuống"${i<dpRows.length-1?"":" disabled"}>↓</button><button type="button" class="del" title="Xóa">🗑</button></span>`;
    const mv = to=>{ const [x] = dpRows.splice(i,1); dpRows.splice(to,0,x); dpChange(); };
    li.querySelector(".up").onclick = ()=>mv(i-1);
    li.querySelector(".dn").onclick = ()=>mv(i+1);
    li.querySelector(".del").onclick = ()=>{ dpRows.splice(i,1); dpChange(); };
    const col = li.querySelector("input[type=color]");
    col.oninput = ()=>{ row.color = col.value; col.parentNode.style.background = col.value; dpDirty = true; dpFoot(); };
    const nm = li.querySelector(".dp-n");
    nm.oninput = ()=>{ row.name = nm.value; dpDirty = true; const ns = dpRows.map(r=>norm(r.name)); $$("#dpList .dp-n").forEach((e,k)=>e.classList.toggle("bad", !dpRows[k].name.trim() || ns.indexOf(ns[k]) !== k)); dpFoot(); };
    /* kéo thả bằng tay nắm ⋮⋮ */
    const h = li.querySelector(".dp-h");
    h.onmousedown = h.ontouchstart = ()=>{ li.draggable = true; };
    li.ondragstart = e=>{ li.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(i)); };
    li.ondragend = ()=>{ li.draggable = false; li.classList.remove("drag"); $$("#dpList li.over").forEach(x=>x.classList.remove("over")); };
    li.ondragover = e=>{ e.preventDefault(); li.classList.add("over"); };
    li.ondragleave = ()=>li.classList.remove("over");
    li.ondrop = e=>{ e.preventDefault(); const from = +e.dataTransfer.getData("text/plain"); if (isNaN(from) || from===i) return; const [x] = dpRows.splice(from,1); dpRows.splice(from < i ? i-1 : i,0,x); dpChange(); };
    ul.appendChild(li);
  });
  $("#aCntDepts").textContent = dpRows.length;
  dpFoot();
}
function dpChange(){ dpDirty = true; dpRender(); }
function dpValid(){ const ns = dpRows.map(r=>norm(r.name)); return dpRows.length > 0 && dpRows.every((r,k)=>r.name.trim() && ns.indexOf(ns[k])===k); }
function dpFoot(){ if (adminTab!=="depts") return; $("#aInfo").textContent = dpDirty ? t("adminDeptUnsaved") : ""; $("#dpSave").disabled = !dpDirty || !dpValid(); }
$("#dpAdd").onclick = ()=>{ const used = new Set(dpRows.map(r=>r.color.toLowerCase())); const color = PALETTE.find(c=>!used.has(c.toLowerCase())) || PALETTE[dpRows.length % PALETTE.length];
  dpRows.push({name:"", orig:"", color}); dpChange(); const ins = $$("#dpList .dp-n"); ins[ins.length-1].focus(); };
$("#dpSave").onclick = async ()=>{
  if (!dpValid()) return;
  const btn = $("#dpSave"); btn.disabled = true;
  const depts = dpRows.map(r=>({name:r.name.trim(), color:r.color}));
  const renames = {}; dpRows.forEach(r=>{ if (r.orig && r.orig !== r.name.trim()) renames[r.orig] = r.name.trim(); });
  try{
    const res = await api("adminSetDepts", {depts, renames});
    if (!res.ok) throw new Error(res.error);
    adminItems.forEach(m=>{ if (renames[m.toDept]) m.toDept = renames[m.toDept]; });
    applyDepts(res.depts || depts); dpInit(); dpRender(); toast(t("adminDeptSaved")); refresh(true);
  }catch(e){ toast(e.message || t("adminSaveError")); btn.disabled = false; }
};
function renderAdmin(){
  const isD = adminTab === "depts";
  $("#aDepts").hidden = !isD; $("#aList").hidden = isD; $(".a-search").hidden = isD;
  $("#aShow").hidden = isD; $("#dpSave").hidden = !isD;
  if (!dpRows) dpInit();
  $("#aCntDepts").textContent = dpRows.length;
  if (isD){
    $$("#aTabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===adminTab));
    dpRender();
  }
  const c = { pending: adminItems.filter(m=>!m.approved), approved: adminItems.filter(m=>m.approved), featured: adminItems.filter(m=>m.featured) };
  $("#aCntPending").textContent = c.pending.length; $("#aCntApproved").textContent = c.approved.length; $("#aCntFeatured").textContent = c.featured.length;
  $$("#aTabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===adminTab));
  $("#aInfo").textContent = t("adminInfo",{n:c.featured.length});
  $("#aShow").disabled = !c.featured.length;
  if (isD) return dpFoot();
  const q = norm($("#aQ").value);
  const list = c[adminTab].filter(m=>!q || norm(m.text).includes(q) || norm(m.toName).includes(q) || norm(m.toDept).includes(q));
  const ul = $("#aList"); ul.textContent = "";
  if (!list.length){ ul.innerHTML = `<li class="a-empty">${esc(t("adminEmpty"))}</li>`; return; }
  list.forEach(m=>{
    const li = document.createElement("li"); if (m.featured) li.className = "is-feat";
    li.innerHTML = `<div class="a-meta">${miniIcon(m)}<b>${esc(recipient(m))}</b> · ${esc(timeAgo(m.time))}</div>
      <div class="a-text">${esc(m.text)}</div>
      <div class="a-acts"><button class="ap ${m.approved?"on":""}">${m.approved?"✓ ":""}${esc(t("adminApprove"))}</button><button class="ft ${m.featured?"on":""}">${m.featured?"★":"☆"} ${esc(t("adminFeature"))}</button></div>`;
    const [ap, ft] = li.querySelectorAll("button");
    ap.onclick = ()=>adminSet(m, {approved: !m.approved}, li);
    ft.onclick = ()=>adminSet(m, {featured: !m.featured}, li);
    ul.appendChild(li);
  });
}
async function adminSet(m, change, li){
  li.querySelectorAll("button").forEach(b=>b.disabled = true);
  try{
    const res = await api("adminSet", Object.assign({id:m.id}, change));
    if (!res.ok) throw new Error();
    m.approved = res.approved; m.featured = res.featured;
    renderAdmin(); refresh(true);
  }catch(e){ toast(t("adminSaveError")); li.querySelectorAll("button").forEach(b=>b.disabled = false); }
}
$$("#aTabs button").forEach(b=>b.onclick = ()=>{ adminTab = b.dataset.tab; renderAdmin(); });
$("#aQ").addEventListener("input", renderAdmin);
$("#adminBtn").onclick = tryAdmin;
$("#adminPin").addEventListener("keydown", e=>{ if (e.key==="Enter") tryAdmin(); });
$("#gateAdmin").onclick = openAdminGate;
$("#btnAdmin").onclick = openAdmin;
$("#aLogout").onclick = ()=>{ ADMIN_PIN = ""; saveAdmin(""); $("#btnAdmin").hidden = true; closeModals(); };
$("#aShow").onclick = ()=>{ refresh(true).then(()=>startShow("featured")); };
if (ADMIN_PIN) $("#btnAdmin").hidden = false;

if (PIN) start(); else showGate();
if (location.hash === "#admin") (ADMIN_PIN ? openAdmin : openAdminGate)();
</script>
