<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cây Tri Ân · Tạm đóng</title>
<style>
  /* Trang tạm đóng. Bản web đầy đủ nằm ở nhánh "ban-day-du"; mở lại: đưa nhánh đó về main. */
  :root{--brand:#E4002B;--ink:#1A1A1A;--muted:#6B6B6B;--bg:#FFF7F8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,var(--bg) 60%,#FCEEF1 100%);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  main{max-width:520px}
  .logo{height:30px;margin-bottom:28px}
  .tree{font-size:64px;line-height:1;margin-bottom:18px}
  h1{margin:0 0 12px;font-size:clamp(24px,5vw,34px);font-weight:900;letter-spacing:-.01em}
  p{margin:0 auto;color:var(--muted);font-size:16px;line-height:1.6;max-width:440px}
  b{color:var(--brand)}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-vinrobotics.svg" alt="VinRobotics">
  <div class="tree" aria-hidden="true">🌳</div>
  <h1>Cây Tri Ân đã khép lại</h1>
  <p>Cảm ơn mọi người đã cùng gửi những lời tri ân mừng sinh nhật <b>VinRobotics</b>. Trang tạm đóng sau sự kiện và sẽ mở lại khi Ban tổ chức cần.</p>
</main>
</body>
</html>
